          ${D.moduleOn('repairs') ? textBtn('repair',icon('wrench',23) + '<span>設備の報告</span>','st-quick-card') : ''}
        </div>
        ${panel('今日の予定',`<ol class="st-timeline"><li><time>18:00</time><div><strong>夕食</strong><small>食堂 ・ 19:30まで</small></div></li>${duty ? `<li><time>${esc(String(duty.when || '').match(/\d{1,2}:\d{2}/)?.[0] || '当番')}</time><div><strong>${esc(duty.title)}</strong><small>${esc(room)}号室の当番</small></div></li>` : ''}<li><time>${esc(D.state.settings.rollTime)}</time><div><strong>点呼</strong><small>自分の部屋で待機</small></div></li></ol>`,jump('student-life','生活予定を見る ' + icon('chevron-right',14)))}
      </div><div class="st-home-aside">
        ${panel('申請の状況', statusRows || empty('申請の履歴はまだありません。'), pending ? statusPill('確認待ち ' + pending + '件','pending') : '')}
        ${panel('寮生活の手続き', [
          ['student-leave','bed','外泊・帰省','申請履歴と帰寮時刻の変更'],
          ...(D.moduleOn('repairs') ? [['student-repairs','wrench','設備の報告','提出した報告の対応状況']] : []),
          ['student-life','calendar',lifeTitle(),D.moduleOn('billing') ? '当番・点呼・長期休暇・請求' : '当番・点呼・長期休暇']
        ].map(([r,i,name,desc]) => jump(r,`<span class="st-icon-box">${icon(i,19)}</span><span class="st-row-main"><strong>${name}</strong><small>${desc}</small></span>${icon('chevron-right',16)}`,'st-row st-click-row')).join(''))}
      </div></div></div>`;
  }

  function leavePage() {
    const list = myRequests().filter(r => ['leave','return'].includes(r.type));
    const shown = list.filter(r => historyFilter === 'all' || r.status === historyFilter);
    return `<div class="st-page">${heading('外泊・帰省','日程と行き先を連絡し、寮の職員からの返答を確認できます。')}
      <div class="st-action-pair">${textBtn('leave',icon('bed',18) + ' 外泊・帰省を申請','btn primary')}${textBtn('return',icon('clock',18) + ' 帰寮時刻を変更')}</div>
      ${panel('自分の申請',`<div class="st-tabs">${[['all','すべて'],['pending','確認待ち'],['approved','承認済み'],['rejected','差し戻し']].map(([id,label]) => textBtn('filter',label,'st-tab',`data-student-filter="${id}" aria-pressed="${id === historyFilter}"`)).join('')}</div>${shown.map(reqRow).join('') || empty('この条件に該当する申請はありません。')}`)}${back()}</div>`;
  }

  function mealsPage() {
    const meal = menus.find(m => m.date === menuDay) || menus[0];
    const booking = myMeal(meal.date);
    const queue = mealQueue(meal.date);
    const pickup = activePickup(meal.date);
    const history = myRequests().filter(r => r.type === 'meal');
    return `<div class="st-page">${heading('食事','献立を選んで、夕食の予約・欠食・取り置きを申請できます。')}
      <div class="st-two"><section class="panel st-panel"><div class="st-section-head"><h2>今週の夕食</h2></div><div class="st-days">${menus.map(m => textBtn('menu-day',`<small>${m.weekday}</small><strong>${m.date.slice(-2)}</strong>`,'st-day',`data-student-date="${m.date}" aria-pressed="${meal.date === m.date}" aria-label="${fullDate(m.date)}の夕食"`)).join('')}</div>
        <div class="st-menu-detail"><p>${fullDate(meal.date)}の夕食</p><h3>${meal.dish}</h3><span>${meal.sides}</span><small>${icon('clock',15)} 18:00–19:30 ・ 食堂</small></div>
        <div class="st-meal-state"><strong>予約状況</strong>${statusPill(booking ? '予約済み' : '未予約', booking ? 'approved' : '')}</div>
        <div class="st-action-pair">${queue ? textBtn('request-detail','依頼内容を確認','btn primary',`data-student-id="${esc(queue.id)}"`) : textBtn('meal', booking ? '欠食を申請' : '夕食を申し込む','btn primary')}${booking && !queue && !pickup ? textBtn('pickup','取り置きを申請','btn',`data-student-date="${meal.date}"`) : ''}</div>
        ${queue || pickup ? `<p class="st-inline-note">${esc((queue || pickup).title)} ・ ${esc(statuses[(queue || pickup).status])}</p>` : ''}</section>
      ${panel('食事に関する申請',history.map(reqRow).join('') || empty('食事に関する申請はまだありません。'))}</div>${back()}</div>`;
  }

  function repairsPage() {
    const rows = myRepairs().map(r => `<div class="st-row"><span class="st-row-main"><strong>${esc(r.place)}</strong><span>${esc(r.detail)}</span><small>${esc(shortDate(r.date))}に報告</small></span>${statusPill(r.status,r.status === '完了' ? 'approved' : 'pending')}</div>`).join('');
    return `<div class="st-page">${heading('設備の報告','部屋や共用スペースの不具合を連絡できます。')}<div class="st-action-pair">${textBtn('repair',icon('plus',17) + ' 不具合を報告','btn primary')}</div>${panel('自分が報告した設備',rows || empty('報告した設備の不具合はありません。'))}${back()}</div>`;
  }

  function lifePage() {
    const duties = myDuties();
    const bills = D.state.bills.filter(b => b.studentId === me);
    const attendance = D.state.attendance[me] || '未確認';
    const plan = D.state.vacationPlans[me];
    return `<div class="st-page">${heading(lifeTitle(),'自分の当番や点呼状況、長期休暇の予定をまとめて確認できます。')}<div class="st-two">
      ${panel('自分の当番', duties.map(d => `<div class="st-row"><span class="st-row-main"><strong>${esc(d.title)}</strong><small>${esc(d.when)}</small></span>${d.done ? statusPill('完了','approved') : textBtn('duty-done','完了を記録','btn st-small',`data-student-id="${esc(d.id)}"`)}</div>`).join('') || empty('割り当てられた当番はありません。'))}
      ${panel('今日の点呼',`<div class="st-row"><span class="st-row-main"><strong>${esc(D.state.settings.rollTime)}　夜の点呼</strong><small>${esc(resident().room)}号室 ・ 職員が確認します</small></span>${statusPill(attendance,attendance === '未確認' ? 'pending' : 'approved')}</div>`)}
      ${panel('冬休みの予定', plan ? `<div class="st-row"><span class="st-row-main"><strong>${esc(plan.destination)}</strong><small>${esc(shortDate(plan.start))} 〜 ${esc(shortDate(plan.end))}</small></span>${statusPill('提出済み','approved')}</div>` : empty('冬休みの滞在先を提出してください。'),textBtn('vacation',plan ? '予定を変更' : '予定を提出','st-link'))}
      ${D.moduleOn('billing') ? panel('利用明細', bills.map(b => `<div class="st-row"><span class="st-row-main"><strong>${esc(b.title)}</strong><small>${fmtMoney(b.amount)}</small></span>${statusPill(b.paid ? '入金済み' : '未入金', b.paid ? 'approved' : 'pending')}</div>`).join('') || empty('現在の請求はありません。')) : ''}</div>${back()}</div>`;
  }

  function showForm(kind, date) {
    const formTag = (content, action='申請を送る') => `<form class="st-form" data-student-form="${kind}" data-student-date="${esc(date || today)}">${content}${buttonField(action)}</form>`;
    const dateInput = (name, val, min=today, max) => `<input type="date" name="${name}" min="${esc(min)}"${max ? ' max="' + esc(max) + '"' : ''} value="${esc(val)}" required>`;
    const note = (placeholder, required=false) => `<textarea name="note" rows="3" maxlength="400" placeholder="${esc(placeholder)}" ${required ? 'required' : ''}></textarea>`;
    const destination = val => `<input type="text" name="destination" maxlength="80" value="${esc(val)}" placeholder="例：横浜の実家" required>`;
    if (kind === 'leave') {
      D.openDialog('外泊・帰省を申請',formTag(
        input('区分','<select name="category"><option>帰省</option><option>外泊</option></select>') +
        '<div class="st-form-grid">' + input('出発日',dateInput('start','2026-11-21')) + input('帰寮日',dateInput('end','2026-11-23','2026-11-21')) + '</div>' +
        input('帰寮予定時刻','<input type="time" name="returnTime" value="19:00" required>') +
        input('滞在先',destination('')) + input('連絡事項（任意）',note('職員に伝えておきたいこと'))));
    } else if (kind === 'return') {
      D.openDialog('帰寮時刻を変更',formTag(input('対象日',dateInput('start',today)) + input('変更後の帰寮時刻','<input type="time" name="returnTime" value="19:30" required>') + input('変更理由',note('例：部活動の終了が遅れるため',true))));
    } else if (kind === 'meal') {
      const booking = myMeal(date);
      D.openDialog(booking ? '欠食を申請' : '夕食を申し込む',formTag(`<p class="st-form-lead">${fullDate(date)}「${esc(menus.find(m => m.date === date).dish)}」の${booking ? '欠食' : '予約'}を職員に依頼します。</p>` + input('連絡事項（任意）',note('職員に伝えておきたいこと'))));
    } else if (kind === 'pickup') {
      D.openDialog('夕食の取り置き',formTag(`<p class="st-form-lead">${fullDate(date)}の夕食を受け取る時刻をお知らせください。</p>` + input('希望受取時刻','<input type="time" name="pickup" value="19:45" min="18:00" max="21:00" required>') + input('連絡事項（任意）',note('例：部活動終了後に食堂へ行きます'))));
    } else if (kind === 'repair') {
      D.openDialog('設備の不具合を報告',formTag(input('場所',`<input type="text" name="place" maxlength="60" value="${esc(resident().room)}号室" required>`) + input('不具合の内容',note('例：入口の照明が点滅しています',true)),'報告を送る'));
    } else if (kind === 'vacation') {
      const plan = D.state.vacationPlans[me] || D.winterBreak;
      D.openDialog('冬休みの予定を提出',formTag('<p class="st-form-lead">2026年12月〜2027年1月の滞在予定を職員に共有します。</p><div class="st-form-grid">' + input('開始日',dateInput('start',plan.start,D.winterBreak.min,D.winterBreak.max)) + input('終了日',dateInput('end',plan.end,plan.start,D.winterBreak.max)) + '</div>' + input('滞在先',destination(plan.destination || '')),'予定を保存'));
    }
  }

  function finish(message, route) {
    D.closeDialog();
    D.save();
    if (route) D.go(route); else D.render();
    D.notify(message);
  }
  function showRequest(id) {
    const r = myRequests().find(item => item.id === id);
    if (!r) return;
    const details = [['受付日',shortDate(r.date)],['区分',typeNames[r.type]],['内容',r.detail],['受け取り',r.kind === 'pickup' && r.status === 'approved' && D.state.kitchenCollected?.[r.id] ? '受け渡し済み' : ''],['職員からの連絡',r.reviewNote || r.response || r.staffNote || '']];
    D.openDialog('申請の詳細',`<div class="st-dialog-record">${statusPill(statuses[r.status],r.status)}<h3>${esc(r.title)}</h3><dl>${details.filter(([,v]) => v).map(([k,v]) => `<div><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join('')}</dl>
      ${r.status === 'pending' ? textBtn('confirm-cancel','この申請を取り下げる','btn',`data-student-id="${esc(id)}"`) : r.status === 'rejected' && ['leave','return'].includes(r.type) ? textBtn('retry','修正して再申請','btn primary',`data-student-id="${esc(id)}"`) : ''}</div>`);
  }

  document.addEventListener('click',event => {
    const button = event.target.closest('[data-student-action]');
    if (!button) return;
    const { studentAction: action, studentId: id, studentDate: date } = button.dataset;
    if (action === 'go') D.go(button.dataset.studentRoute);
    else if (action === 'filter') { historyFilter = button.dataset.studentFilter; D.render(); }
    else if (action === 'menu-day') { menuDay = date; D.render(); }
    else if (action === 'request-detail') showRequest(id);
    else if (action === 'retry') {
      const r = myRequests().find(item => item.id === id && item.status === 'rejected');
      if (!r || !['leave','return'].includes(r.type)) return;
      showForm(r.type,today);
      const form = document.querySelector('[data-student-form]');
      const values = { category: r.category || '帰省', start: r.start || r.returnDate || r.date, end: r.end, destination: r.destination, returnTime: r.returnTime || r.expectedTime, note: r.note || '' };
      for (const [key,value] of Object.entries(values)) {
        const field = form.elements.namedItem(key);
        if (field && value) field.value = value;
      }
      if (form.elements.end) form.elements.end.min = form.elements.start.value;
    }
    else if (action === 'confirm-cancel') {
      const item = myRequests().find(r => r.id === id && r.status === 'pending');
      if (item) D.openDialog('申請を取り下げますか？',`<p class="st-form-lead">「${esc(item.title)}」を取り下げると、職員の確認待ち一覧からも消えます。</p><div class="st-form-actions">${textBtn('request-detail','戻る','btn',`data-student-id="${esc(id)}"`)}${textBtn('cancel','取り下げる','btn primary',`data-student-id="${esc(id)}"`)}</div>`);
    } else if (action === 'cancel') {
      const i = D.state.requests.findIndex(r => r.id === id && r.studentId === me && r.status === 'pending');
      if (i >= 0) { D.state.requests.splice(i,1); finish('申請を取り下げました'); }
    } else if (action === 'duty-done') {
      const duty = myDuties().find(d => d.id === id);
      if (duty && !duty.done) { duty.done = true; D.save(); D.render(); D.notify('当番の完了を記録しました'); }
    } else if (['meal','pickup','leave','return','repair','vacation'].includes(action)) showForm(action,date || (action === 'meal' ? menuDay : today));
  });

  document.addEventListener('input',event => {
    const field = event.target;
    const form = field.closest('[data-student-form]');
    if (!form) return;
    field.setCustomValidity('');
    if (field.name === 'start' && form.elements.end) {
      form.elements.end.min = field.value || (form.dataset.studentForm === 'vacation' ? D.winterBreak.min : today);
      if (form.elements.end.value < field.value) form.elements.end.value = field.value;
    }
  });

  document.addEventListener('submit',event => {
    const form = event.target.closest('[data-student-form]');
    if (!form) return;
    event.preventDefault();
    for (const field of form.querySelectorAll('input[type="text"][required],textarea[required]')) {
      if (!field.value.trim()) { field.setCustomValidity('内容を入力してください。'); field.reportValidity(); return; }
    }
    if (!form.reportValidity()) return;
    const kind = form.dataset.studentForm;
    const date = form.dataset.studentDate;
    const fields = Object.fromEntries(new FormData(form));
    const note = (fields.note || '').trim();
    if (kind === 'repair') {
      D.state.repairs.unshift({ id: appendId('repair'), studentId: me, place: fields.place.trim(), detail: note, status: '未対応', date: today });
      finish('設備の不具合を職員に報告しました','student-repairs');
      return;
    }
    if (kind === 'vacation') {
      D.state.vacationPlans[me] = { start: fields.start, end: fields.end, destination: fields.destination.trim() };
      finish('冬休みの予定を提出しました','student-life');
      return;
    }
    const r = { id: appendId('request'), studentId: me, type: kind === 'pickup' ? 'meal' : kind, status: 'pending', date: today, note };
    if (kind === 'leave') {
      Object.assign(r,{ category: fields.category, start: fields.start, end: fields.end, destination: fields.destination.trim(), returnTime: fields.returnTime });
      r.title = shortDate(r.start) + '–' + shortDate(r.end) + 'の' + fields.category;
      r.detail = r.destination + ' ・ ' + shortDate(r.end) + ' ' + r.returnTime + '帰寮予定';
    } else if (kind === 'return') {
      r.returnDate = fields.start; r.returnTime = fields.returnTime; r.expectedTime = fields.returnTime;
      r.title = '帰寮時刻の変更'; r.detail = shortDate(fields.start) + ' ' + fields.returnTime + '帰寮予定';
    } else if (kind === 'meal' || kind === 'pickup') {
      if (mealQueue(date)) { finish('この日の夕食は職員がすでに確認中です','student-meals'); return; }
      r.mealDate = date;
      if (kind === 'pickup') {
        r.kind = 'pickup'; r.pickup = fields.pickup; r.title = '夕食の取り置き';
        r.detail = shortDate(date) + ' ' + r.pickup + 'に受取希望';
      } else {
        r.mealValue = !myMeal(date);
        r.title = r.mealValue ? '夕食の追加' : '夕食の欠食';
        r.detail = shortDate(date) + 'の夕食を' + (r.mealValue ? '追加' : 'キャンセル');
      }
      menuDay = date;
    }
    if (note) r.detail += ' ／ ' + note;
    D.state.requests.unshift(r);
    historyFilter = 'all';
    finish('職員に申請を送りました',r.type === 'meal' ? 'student-meals' : 'student-leave');
  });

  D.register('student',home);
  D.register('student-leave',leavePage);
  D.register('student-meals',mealsPage);
  D.register('student-repairs',repairsPage);
  D.register('student-life',lifePage);
})();

</script>
<script>
window.DD.start();

</script>
</body>
</html>
