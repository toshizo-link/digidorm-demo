<head>
  <meta charset="utf-8">

  <title>今日の寮 | digidorm</title>
  <style>
:root {
  color-scheme: light;
  --bg:#f6f6f0; --paper:#fffefa; --ink:#172e27; --forest:#124c3e; --green:#124c3e; --muted:#65726a;
  --line:#dce1d8; --mint:#e5efe5; --ochre:#8a560c; --amber:#f8eacb;
  --radius:16px; font-family:Inter,-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;
  color:var(--ink); background:var(--bg); font-size:14px; font-synthesis:none; -webkit-text-size-adjust:100%;
}
*{box-sizing:border-box}
body{margin:0;line-height:1.55;letter-spacing:.015em}
body:has(dialog[open]){overflow:hidden}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button,a,input,select,textarea{touch-action:manipulation}
button{cursor:pointer}
button:disabled{cursor:default;opacity:.46}
:focus-visible{outline:3px solid #379172;outline-offset:3px}
h1,h2,h3,h4,p{margin-top:0}
h1,h2,h3,h4{color:#12382d;line-height:1.35;letter-spacing:-.035em}
h1{font-size:clamp(29px,3vw,43px);margin-bottom:9px;font-weight:750}
h2{font-size:21px;margin-bottom:10px;font-weight:700}
h3{font-size:16px;margin-bottom:8px}
.ui-icon{display:inline-block;vertical-align:middle;flex:none}
#shell{min-height:100vh;display:grid;grid-template-columns:216px minmax(0,1fr)}
#sidebar{position:sticky;top:0;height:100vh;height:100dvh;display:flex;flex-direction:column;border-right:1px solid var(--line);background:#fbfbf6;padding:24px 16px 12px;z-index:4;overflow:auto;scrollbar-width:thin}
.brand-row{display:flex;align-items:center;justify-content:space-between;padding:0 6px}
.wordmark{font-family:"Arial Rounded MT Bold",Avenir Next,Inter,Arial,sans-serif;font-weight:850;font-size:35px;line-height:1;letter-spacing:-2.7px;color:#103e32}
.wordmark span{color:#71916b}
.dorm-id{display:flex;gap:10px;align-items:center;margin:21px 2px 22px;padding:10px 11px;border:1px solid var(--line);border-radius:10px;background:var(--paper)}
.dorm-icon{width:32px;height:32px;display:grid;place-items:center;background:#e5eee2;color:var(--forest);border-radius:8px}
.dorm-id strong,.dorm-id small,.profile strong,.profile small{display:block;line-height:1.45}
.dorm-id small,.profile small{font-size:10px;color:var(--muted);margin-top:2px}
.nav-label{font-size:10px;letter-spacing:.065em;color:#69756b;font-weight:650;padding:0 11px;margin-bottom:6px}
.nav-group-next{margin-top:20px}
.nav-item{display:flex;align-items:center;gap:11px;color:#354d42;min-height:36px;padding:7px 10px;border-radius:8px;font-size:13px;font-weight:550;margin:2px 0}
.nav-item:hover,.role-switch:hover{background:#ecf0e7}
.nav-item.active{background:#154d3e;color:white}
.nav-item small{margin-left:auto;background:#e6ebde;padding:0 6px;color:#315547;border-radius:5px;font-size:11px}
.nav-item.active small{background:#35715c;color:white}
.nav-divider{margin:16px 3px 8px;border-top:1px solid var(--line)}
.sidebar-end{margin-top:auto;padding-top:22px}
.role-switch{display:flex;align-items:center;gap:8px;border:1px solid var(--line);padding:8px 10px;border-radius:8px;color:var(--forest);font-size:12px;font-weight:650}
.role-switch svg:last-child{margin-left:auto}
.profile{display:flex;align-items:center;gap:10px;padding:14px 5px 0;color:#294639}
.profile-icon,.avatar{background:#e3ecdd;display:inline-grid;place-items:center;color:#365d48;font-weight:700;flex:none;border-radius:50%;width:32px;height:32px;font-size:12px}
.profile strong{font-size:12px}
#main{min-width:0;width:100%;max-width:1670px;margin:0 auto;padding:34px clamp(22px,3vw,50px) 45px;outline:none}
#mobile-bar,.brand-row .nav-close,#student-dock{display:none}
#skip{position:fixed;left:12px;top:-80px;background:white;padding:10px;z-index:20}#skip:focus{top:12px}
#nav-shade[hidden]{display:none}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:21px}
.eyebrow{display:block;font-weight:650;font-size:12px;color:#546c5d;letter-spacing:.045em;margin:0 0 6px}
.page-head p:last-child{margin-bottom:0}
.muted,.subtle{color:var(--muted)}
.panel{min-width:0;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:0 2px 5px #36432e04}
.btn,.icon-btn{border:1px solid #c6d1c4;background:var(--paper);color:var(--forest);border-radius:8px;display:inline-flex;align-items:center;justify-content:center;gap:7px;font-weight:650;line-height:1.35}
.btn{font-size:13px;min-height:36px;padding:8px 13px}
.btn:not(:disabled):hover,.icon-btn:not(:disabled):hover{background:#edf2e9;border-color:#93ac99}
.btn.primary{background:var(--forest);color:white;border-color:var(--forest)}
.btn.primary:not(:disabled):hover{background:#0e3c30}
.icon-btn{width:35px;height:35px;font-size:23px}
.chip{display:inline-flex;align-items:center;gap:4px;line-height:1.35;background:var(--mint);color:#2d593f;padding:3px 9px;border-radius:20px;font-weight:650;font-size:11px;vertical-align:middle}
.chip.warn{background:var(--amber);color:var(--ochre)}.chip.neutral{background:#ededE6;color:#566257}
.empty{padding:22px;text-align:center;color:var(--muted);background:#f4f6ef;border-radius:9px}
.grid-two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
input:not([type=checkbox]):not([type=radio]):not([type=range]),select,textarea{border:1px solid #c7d1c6;background:var(--paper);border-radius:7px;min-height:36px;padding:7px 9px;max-width:100%}
input[type=checkbox],input[type=radio]{accent-color:var(--forest)}
textarea{resize:vertical}
button,input,textarea,select{letter-spacing:inherit}
dialog{color:var(--ink);width:min(510px,calc(100% - 30px));max-height:88dvh;overflow:auto;padding:0;border-radius:16px;border:1px solid #c4cec1;background:var(--paper);box-shadow:0 20px 80px #152e2933}
dialog::backdrop{background:#162c266b}
.dialog-head{position:sticky;top:0;z-index:2;background:var(--paper);display:flex;align-items:center;justify-content:space-between;gap:14px;padding:17px 22px;border-bottom:1px solid var(--line)}
.dialog-head h2{font-size:20px;margin:0}.dialog-head .icon-btn{border:0;background:#f3f4ed}
#dialog-body{padding:20px 22px 24px;overflow-wrap:anywhere}
#toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,12px);max-width:calc(100vw - 32px);width:max-content;opacity:0;pointer-events:none;transition:opacity .15s,transform .15s;padding:9px 15px;background:#173f33;color:white;border-radius:9px;z-index:30;font-size:13px;box-shadow:0 3px 18px #183c3022}
#toast.visible{opacity:1;transform:translate(-50%,0)}
#print-roll{display:none}
@media(min-width:751px) and (max-height:790px){#sidebar{padding-top:18px}.dorm-id{margin:15px 2px}.nav-item{min-height:32px;padding:5px 10px}.nav-group-next{margin-top:12px}.sidebar-end{padding-top:12px}}
@media(max-width:1050px) and (min-width:751px){#shell{grid-template-columns:182px minmax(0,1fr)}#sidebar{padding-left:12px;padding-right:12px}#main{padding:26px 20px}}
@media(max-width:750px){
 #shell{display:block}#mobile-bar{display:flex;align-items:center;gap:10px;min-height:55px;padding:9px 15px;background:#fbfbf7;border-bottom:1px solid var(--line)}
 #mobile-bar .wordmark{font-size:27px;letter-spacing:-2px}#mobile-bar .icon-btn{border:0;background:transparent;width:28px}
 .mobile-switch{margin-left:auto;display:inline-flex;align-items:center;gap:5px;border:1px solid #cbd5c9;border-radius:7px;padding:6px 9px;font-size:11px;font-weight:650;color:var(--forest)}
 #sidebar{position:fixed;left:0;transform:translateX(-105%);width:min(262px,84vw);visibility:hidden;transition:transform .16s ease;z-index:11}
 .nav-open #sidebar{transform:none;visibility:visible}.brand-row .nav-close{display:flex}#nav-shade{position:fixed;inset:0;background:#102d2366;z-index:10}
 #main{padding:22px 15px 38px}.page-head{align-items:flex-start;flex-wrap:wrap;gap:10px;margin-bottom:15px}.grid-two{grid-template-columns:1fr}
 .panel{padding:16px;border-radius:13px}.student-view #main{padding-bottom:88px}
 .student-view #student-dock{position:fixed;display:grid;grid-auto-columns:minmax(0,1fr);grid-auto-flow:column;bottom:0;left:0;right:0;z-index:5;border-top:1px solid var(--line);background:#fbfbf8;padding:5px 5px max(4px,env(safe-area-inset-bottom))}
 #student-dock .nav-item{flex-direction:column;gap:2px;min-height:40px;margin:0;padding:3px 0;font-size:10px;border-radius:6px}
 #student-dock .active{background:#e7eee2;color:#164a38} .student-view #toast{bottom:75px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
@media print{body{background:white}#shell,#toast,dialog,#skip{display:none!important}#print-roll{display:block;color:#111}#print-roll table{width:100%;border-collapse:collapse;font-size:11px}#print-roll td,#print-roll th{text-align:left;border:1px solid #bbb;padding:4px 7px}#print-roll tr{break-inside:avoid}#print-roll thead{display:table-header-group}@page{size:A4;margin:12mm}}

</style>
  <style>

  <style>

    return '<svg class="ui-icon" aria-hidden="true" width="'+Number(size)+'" height="'+Number(size)+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="'+path+'"/></svg>';
  }
  function esc(v){return String(v ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
  function seed(){
    const names='佐藤 遥|田中 悠斗|鈴木 凛|高橋 颯太|中村 依子|渡辺 葵|伊藤 翔|小林 結衣|加藤 陸|山本 早紀|吉田 湊|山田 美桜|佐々木 悠|松本 花|井上 航|木村 紬|林 蓮|清水 結菜|山口 蒼|森 彩葉|池田 翼|橋本 茜|阿部 陽|石川 柚希|山崎 結人|前田 雫|藤田 大和|岡田 美月|後藤 朝陽|長谷川 結|村上 海斗|近藤 沙良|石井 理央|坂本 杏|遠藤 光|青木 栞|藤井 匠|福田 玲|西村 遥斗|三浦 花音|藤原 岳|岡本 千尋|松田 拓海|中川 瑞希|竹内 優|小野 咲|田村 圭|金子 朱音'.split('|');
    const rooms=[201,202,203,204,205,206,301,302,303,304,305,306];
    const residents=names.map((name,i)=>{
      const slot=i===0?8:i===8?0:i;
      return {id:'s'+String(i+1).padStart(2,'0'),name,room:String(rooms[Math.floor(slot/4)]),grade:1+slot%3};
    });
    const away=['s18','s29','s37','s48'];
    const mealChoices=Object.fromEntries(residents.map(p=>[p.id,![...away,'s02','s46'].includes(p.id)]));
    const requests=[
      {id:'q1',studentId:'s01',type:'return',title:'帰寮時刻の変更',detail:'部活動のため、19:10に帰寮予定です。',expectedTime:'19:10',date:TODAY,status:'pending'},
      {id:'q2',studentId:'s02',type:'meal',title:'夕食の追加',detail:'部活動が早く終わるため、今日の夕食を希望します。',mealValue:true,mealDate:TODAY,date:TODAY,status:'pending'},
      {id:'q3',studentId:'s03',type:'leave',title:'週末の帰省',detail:'11月21日から23日まで実家に帰省します。',destination:'実家',start:'2026-11-21',end:'2026-11-23',date:'2026-11-16',status:'pending'},
      ...away.map((studentId,i)=>({id:'out'+i,studentId,type:'leave',title:'帰省',detail:'帰省の届け出を確認済みです。',start:'2026-11-16',end:'2026-11-18',destination:'実家',date:'2026-11-14',status:'approved'}))
    ];
    return {residents,requests,mealChoices,mealDefaults:{...mealChoices},datedMealChoices:{},attendance:Object.fromEntries(residents.map(p=>[p.id,away.includes(p.id)?'外泊':'未確認'])),
      repairs:[{id:'fix1',studentId:'s01',place:'203号室',detail:'入口の照明が点滅しています。',status:'対応中',date:'2026-11-16'},{id:'fix2',studentId:'s12',place:'東棟 2階洗面所',detail:'左端の蛇口から水が漏れています。',status:'未対応',date:TODAY}],
      vacationPlans:{s03:{start:'2026-12-24',end:'2027-01-06',destination:'実家'},s14:{start:'2026-12-25',end:'2027-01-05',destination:'祖父母宅'}},
      duties:[{id:'d1',title:'203号室の照明を確認',owner:'山田先生',when:'21:00',done:false},{id:'d2',title:'予備鍵の返却を確認',owner:'高木先生',when:'22:00',done:false},{id:'d3',title:'談話室の清掃',owner:'佐藤 遥',when:'20:30',done:false}],
      handovers:[{id:'h1',text:'食堂側の予備鍵を貸し出し中です。返却されたら鍵箱へ戻してください。',by:'高木先生',time:'16:30'}],
      bills:[{id:'b1',studentId:'s01',title:'11月分 寮費',amount:30000,paid:false},{id:'b2',studentId:'s01',title:'10月分 食費',amount:16500,paid:true},{id:'b3',studentId:'s02',title:'11月分 寮費',amount:30000,paid:false},{id:'b4',studentId:'s03',title:'11月分 寮費',amount:30000,paid:true}],
      settings:{rollTime:'22:00',guardianCheck:true,kitchenCheck:true,modules:{repairs:true,billing:true}},roomPlan:null};
  }
  function load(){try{const data=JSON.parse(localStorage.getItem(STORE));return data && Array.isArray(data.residents) && data.settings ? data : seed();}catch{return seed();}}
  const state=load();
  function save(){try{localStorage.setItem(STORE,JSON.stringify(state));}catch{notify('このブラウザでは変更を今回の画面内で保持します。');}}
  function notify(message){const el=document.getElementById('toast');el.textContent=message;el.classList.add('visible');clearTimeout(notify.timer);notify.timer=setTimeout(()=>el.classList.remove('visible'),3200);}
  function openDialog(title,htmlContent){
    const dialog=document.getElementById('dialog');document.getElementById('dialog-title').textContent=title;document.getElementById('dialog-body').innerHTML=htmlContent;
    if(!dialog.open) dialog.showModal();
    dialog.scrollTop=0;
  }
  function closeDialog(){const dialog=document.getElementById('dialog');if(dialog.open)dialog.close();}
  const staffNav=[
    ['staff','今日の寮','home'],['requests','申請・外泊','bag'],['roll','点呼','check-circle'],['meals','食事','utensils'],
    ['residents','寮生名簿','users'],['rooms','部屋割り','bed'],['vacations','長期休暇','calendar'],['duties','当直・引継ぎ','clipboard'],['repairs','設備報告','wrench'],['billing','請求・入金','wallet'],['settings','学校設定','gear']
  ];
  const studentNav=[['student','今日','home'],['student-leave','外泊・帰省','bag'],['student-meals','食事','utensils'],['student-repairs','設備報告','wrench'],['student-life','寮生活','calendar']];
  let route='staff';
  function moduleOn(key){return state.settings.modules?.[key]!==false;}
  function enabled(id){return id==='student-repairs'||id==='repairs'?moduleOn('repairs'):id==='billing'?moduleOn('billing'):true;}
  function validRoute(id){return !index.has(id)?'staff':enabled(id)?id:id.startsWith('student')?'student':'staff';}
  const winterBreak={min:'2026-12-01',max:'2027-01-31',start:'2026-12-24',end:'2027-01-07'};
  function setDrawer(open){document.body.classList.toggle('nav-open',open);document.getElementById('nav-shade').hidden=!open;document.querySelector('[data-menu]')?.setAttribute('aria-expanded',String(open));}
  function go(id){
    id=validRoute(id);
    if(location.hash.slice(1)!==id)location.hash=id;
    activate(id);
  }
  function activate(id){
    const requested=id;
    id=validRoute(id);
    if(requested && id!==requested)history.replaceState(null,'','#'+id);
    const changed=id!==route;route=id;closeDialog();setDrawer(false);render();
    if(changed){window.scrollTo(0,0);document.getElementById('main').focus({preventScroll:true});}
  }
  const navItem=([id,label,glyph])=>'<a class="nav-item'+(route===id?' active':'')+'" href="#'+id+'" '+(route===id?'aria-current="page"':'')+'>'+icon(glyph,18)+'<span>'+label+'</span>'+(id==='requests'&&state.requests.some(x=>x.status==='pending')?'<small>'+state.requests.filter(x=>x.status==='pending').length+'</small>':'')+'</a>';
  function render(){
    const student=route.startsWith('student');
    const nav=(student?studentNav:staffNav).filter(([id])=>enabled(id));
    const person=student?'佐藤 遥':'山田先生';
    const alt=student?'staff':'student';
    const switchLabel=student?'職員画面へ':'寮生画面へ';
    document.body.classList.toggle('student-view',student);
    document.title=(nav.find(x=>x[0]===route)?.[1] || '青葉寮')+' | digidorm';
    const brand='<a class="wordmark" href="#'+(student?'student':'staff')+'" aria-label="digidorm ホーム">digidorm<span>.</span></a>';
    document.getElementById('mobile-bar').innerHTML='<button class="icon-btn" type="button" data-menu aria-controls="sidebar" aria-expanded="false" aria-label="メニューを開く">'+icon('menu',22)+'</button>'+brand+'<a href="#'+alt+'" class="mobile-switch">'+icon('swap',15)+switchLabel+'</a>';
    const navBlock=student?'<div class="nav-label">寮生メニュー</div>'+nav.map(navItem).join(''):'<div class="nav-label">日々の運営</div>'+staffNav.slice(0,4).map(navItem).join('')+'<div class="nav-label nav-group-next">寮の管理</div>'+staffNav.slice(4,10).filter(([id])=>enabled(id)).map(navItem).join('')+'<div class="nav-divider"></div>'+staffNav.slice(10).map(navItem).join('');
    document.getElementById('sidebar').innerHTML='<div class="brand-row">'+brand+'<button class="icon-btn nav-close" data-menu aria-label="メニューを閉じる">'+icon('x',18)+'</button></div><div class="dorm-id"><span class="dorm-icon">'+icon('school',19)+'</span><div><strong>青葉寮</strong><small>'+ (student?'寮生ポータル':'職員ポータル')+'</small></div></div><nav class="main-nav" aria-label="主メニュー">'+navBlock+'</nav><div class="sidebar-end"><a href="#'+alt+'" class="role-switch">'+icon('swap',16)+switchLabel+icon('chevron-right',15)+'</a><div class="profile"><span class="profile-icon">'+(student?'佐':'山')+'</span><div><strong>'+person+'</strong><small>'+(student?'東棟 · 203号室':'寮務室 · 当直職員')+'</small></div></div></div>';
    document.getElementById('main').innerHTML=index.get(route)();
    document.getElementById('student-dock').innerHTML=student?nav.map(navItem).join(''):'';
  }
  function start(){
    document.getElementById('close-dialog').onclick=closeDialog;
    document.getElementById('skip').onclick=e=>{e.preventDefault();document.getElementById('main').focus();};
    document.getElementById('dialog').addEventListener('click',e=>{if(e.target===e.currentTarget && (e.clientX<e.target.getBoundingClientRect().left||e.clientX>e.target.getBoundingClientRect().right||e.clientY<e.target.getBoundingClientRect().top||e.clientY>e.target.getBoundingClientRect().bottom))closeDialog();});
    document.addEventListener('click',e=>{
      if(e.target.closest('[data-menu]'))setDrawer(!document.body.classList.contains('nav-open'));
      if(e.target.closest('#nav-shade'))setDrawer(false);
      const a=e.target.closest('a[href^="#"]');if(a && !e.ctrlKey && !e.metaKey && !e.shiftKey){const id=a.hash.slice(1);if(index.has(id)){e.preventDefault();go(id);}}
    });
    document.addEventListener('keydown',e=>{if(e.key==='Escape')setDrawer(false);});
    window.addEventListener('hashchange',()=>{const id=location.hash.slice(1);if(id!==route)activate(id);});
    activate(location.hash.slice(1));
  }
  function resetDemo(){for(const key of Object.keys(state))delete state[key];Object.assign(state,seed());save();closeDialog();render();notify("サンプルデータを初期状態に戻しました");}
  window.DD={resetDemo,moduleOn,winterBreak,TODAY,state,icon,esc,save,notify,openDialog,closeDialog,go,render,start,register:(id,fn)=>index.set(id,fn),get route(){return route;}};
})();

</script>
<script>
(function staffScreens() {
  'use strict';
  const D=window.DD, S=D.state, E=D.esc, I=D.icon, today=D.TODAY;
  let requestTab='pending', requestType='all', rollFilter='all', rollRoom='all', rollQuery='', planFilter='all';
  const person=id=>S.residents.find(p=>p.id===id);
  const pending=()=>S.requests.filter(r=>r.status==='pending');
  const isAway=id=>S.requests.some(r=>r.studentId===id && r.type==='leave' && r.status==='approved' && r.start<=today && r.end>today);
  const returnPlan=id=>S.requests.find(r=>r.studentId===id && r.type==='return' && r.status==='approved' && (r.returnDate||r.date)===today);
  const planLabel=id=>{if(isAway(id))return '外泊';const r=returnPlan(id);return r?.expectedTime?r.expectedTime+'帰寮':'在寮';};
  const statusLabels={pending:'確認待ち',approved:'承認済み',rejected:'差し戻し'};
  const typeLabels={leave:'外泊・帰省',return:'帰寮時刻',meal:'食事'};
  const countPeople=(n,unit='人')=>`<b>${n}</b><small>${unit}</small>`;
  const dateLabel=s=>s&&s.length===10?`${Number(s.slice(5,7))}/${Number(s.slice(8,10))}`:'—';
  const labelPerson=p=>`<span class="staff-person"><span class="avatar">${E(p.name.slice(0,1))}</span><span>${E(p.name)}</span></span>`;
  const link=(key,text,cls='staff-link')=>`<a href="#${key}" class="${cls}">${text}${I('chevron-right',15)}</a>`;
  const badge=(s,cls='')=>`<span class="chip ${cls}">${E(s)}</span>`;
  const stats=items=>`<div class="staff-stats">${items.map(([label,n,u,cls,target,focus])=>`<${target?'a':'div'} ${target?`href="#${target}" data-staff-focus="${focus||target}"`:''} class="staff-stat ${cls||''}"><span>${label}</span><div>${countPeople(n,u)}</div></${target?'a':'div'}>`).join('')}</div>`;
  const cardHead=(title,extra='')=>`<header class="staff-panel-head"><h2>${title}</h2>${extra}</header>`;
  const printButton=()=>`<button type="button" class="btn" data-staff-action="print">${I('print',16)}点呼表を印刷</button>`;
  const reviewButton=(r,label='内容を見る')=>`<button class="btn staff-row-btn" type="button" data-staff-action="review" data-id="${E(r.id)}">${label}${I('chevron-right',12)}</button>`;
  function requiredCheck(r){
    if(r.type==='leave' && S.settings.guardianCheck) return {label:'保護者の確認',done:!!r.guardianConfirmed,key:'guardianConfirmed'};
    if(r.type==='meal' && S.settings.kitchenCheck) return {label:'厨房の確認',done:!!r.kitchenConfirmed,key:'kitchenConfirmed'};
    return null;
  }
  function taskRows(){
    const selected=S.duties.filter(t=>String(t.owner).includes('先生')).slice(0,2);
    return selected.map(t=>`<label class="staff-task ${t.done?'is-done':''}"><input type="checkbox" data-staff-duty="${E(t.id)}" ${t.done?'checked':''}><span><strong>${E(t.title)}</strong><small>${E(t.owner)}<span> · </span>${E(t.when)}まで</small></span></label>`).join('')||'<p class="empty">当直の業務はありません。</p>';
  }
  function requestsRows(items){
    return items.length?`<div class="staff-scroll"><table class="staff-table staff-queue"><thead><tr><th>寮生</th><th>申請内容</th><th>確認状況</th><th><span class="sr">操作</span></th></tr></thead><tbody>${items.map(r=>{
      const p=person(r.studentId),check=requiredCheck(r);
      const summary=r.status==='pending'?(check?(check.done?'職員承認待ち':check.label+'待ち'):(r.expectedTime?r.expectedTime+' 帰寮予定':'職員承認待ち')):statusLabels[r.status];
      return `<tr><td>${labelPerson(p)}</td><td>${E(r.title)}</td><td>${badge(summary,r.status==='pending'?'warn':r.status==='rejected'?'neutral':'')}</td><td>${reviewButton(r)}</td></tr>`;
    }).join('')}</tbody></table></div>`:'<p class="empty">該当する申請はありません。</p>';
  }
  function todayRoster(){
    const preview=['s04','s01','s05','s18'].map(person);
    return `<div class="staff-scroll"><table class="staff-table"><thead><tr><th>部屋</th><th>寮生</th><th>予定</th><th>連絡</th></tr></thead><tbody>${preview.map(p=>{
      const away=isAway(p.id),ret=returnPlan(p.id);
      const pendingRet=pending().find(r=>r.studentId===p.id && r.type==='return' && (r.returnDate||r.date)===today);
      const note=ret?ret.expectedTime+'に帰寮予定':pendingRet?'帰寮時刻を確認中':away?'外泊届を確認済み':'—';
      return `<tr><td class="staff-room-no">${E(p.room)}</td><td>${E(p.name)}</td><td>${badge(away?'外泊':ret?ret.expectedTime+'帰寮':'在寮',away?'neutral':'')}</td><td class="staff-table-note">${E(note)}</td></tr>`;
    }).join('')}</tbody></table></div>`;
  }
  function dashboard(){
    const queue=pending(), away=S.residents.filter(p=>isAway(p.id)).length;
    const mealCount=S.residents.filter(p=>S.mealChoices[p.id]).length;
    const mealQueue=queue.filter(r=>r.type==='meal' && (r.mealDate||today)===today);
    const plus=mealQueue.filter(r=>r.mealValue===true).length;
    const mealStatus=plus && plus===mealQueue.length?`追加 ${plus}食 ・ 確認待ち`:`食事変更 ${mealQueue.length}件 ・ 確認待ち`;
    return `<div class="staff-screen">
      <header class="page-head dash-head"><div><p class="eyebrow">11月17日（火）<span class="date-dot">·</span>17:40 時点</p><h1>今日の寮</h1></div><div class="staff-actions">${printButton()}<a class="btn primary" href="#roll">${I('check-circle',17)}点呼をはじめる</a></div></header>
      <div class="shift-strip">${I('clipboard',16)}<span>今夜の点呼 <b>${E(S.settings.rollTime)}</b></span><i></i><span>当直 <b>山田先生</b></span></div>
      ${stats([['登録寮生',S.residents.length,'人','','residents'],['在寮予定',S.residents.length-away,'人','','roll','in'],['外泊予定',away,'人','','roll','out'],['確認待ち',queue.length,'件','waiting','requests','pending']])}
      <div class="staff-layout"><div class="staff-column">
        <section class="panel staff-panel">${cardHead('確認が必要な変更',badge(queue.length+'件','warn'))}${requestsRows(queue.slice(0,3))}<div class="staff-card-foot">${link('requests','申請一覧を開く')}</div></section>
        <section class="panel staff-panel">${cardHead('今夜の在寮予定',link('roll','点呼表へ'))}${todayRoster()}</section>
      </div><div class="staff-column">
        <section class="panel staff-side">${cardHead('厨房への共有')}<div class="kitchen-count"><span class="meal-glyph">${I('utensils',21)}</span><span>夕食</span><div>${countPeople(mealCount,'食')}</div><small>確定</small></div>${mealQueue.length?`<div class="staff-wait">${I('clock',14)}${mealStatus}</div>`:'<div class="staff-clear">'+I('check',14)+' 申請はすべて確認済み</div>'}${link('meals','食数表を開く','staff-bottom-link')}</section>
        <section class="panel staff-side">${cardHead('当直の引継ぎ')}<div class="staff-tasks">${taskRows()}</div>${link('duties','引継ぎを開く','staff-bottom-link')}</section>
      </div></div></div>`;
  }
  D.register('staff',dashboard);
  function requestsPage(){
    const all=S.requests.filter(r=>requestType==='all'||r.type===requestType);
    const items=all.filter(r=>requestTab==='all'||r.status===requestTab);
    return `<div class="staff-screen"><header class="page-head"><div><p class="eyebrow">青葉寮 · 寮生からの届け出</p><h1>申請・外泊</h1></div></header><section class="panel staff-panel">${cardHead('申請一覧')}<div class="staff-filterbar"><div class="staff-tabs">${[['pending','確認待ち'],['approved','承認済み'],['rejected','差し戻し'],['all','すべて']].map(([key,label])=>`<button data-staff-tab="${key}" aria-pressed="${key===requestTab}">${label}<small>${key==='all'?all.length:all.filter(r=>r.status===key).length}</small></button>`).join('')}</div><label class="staff-select"><span class="sr">申請の種類</span><select data-staff-type>${[['all','すべての種類'],...Object.entries(typeLabels)].map(([k,v])=>`<option value="${k}" ${k===requestType?'selected':''}>${v}</option>`).join('')}</select></label></div>${requestsRows(items)}</section></div>`;
  }
  D.register('requests',requestsPage);
  function review(rid){
    const r=S.requests.find(x=>x.id===rid);if(!r)return;
    const p=person(r.studentId),need=requiredCheck(r);
    let details=[['寮生',p.name+' ・ '+p.room+'号室'],['受付日',dateLabel(r.date)],['種類',typeLabels[r.type]]];
    if(r.type==='leave')details.push(['外泊期間',dateLabel(r.start)+' 〜 '+dateLabel(r.end)],['行き先',r.destination || '—']);
    if(r.type==='meal')details.push(['対象の夕食',dateLabel(r.mealDate||r.date)]);
    if(r.type==='return')details.push(['帰寮予定',dateLabel(r.returnDate||r.date)+' '+(r.expectedTime||'')]);
    if(r.reviewNote)details.push(['職員からのコメント',r.reviewNote]);
    D.openDialog(r.title,`<div class="staff-review">${badge(statusLabels[r.status],r.status==='pending'?'warn':'')}<dl>${details.map(([l,v])=>`<div><dt>${E(l)}</dt><dd>${E(v)}</dd></div>`).join('')}</dl><p class="staff-request-detail">${E(r.detail)}</p>${r.status==='pending'?`${need?`<div class="staff-checkstep"><strong>${E(need.label)}</strong><p>電話・対面などで確認した結果を記録します。</p>${need.done?badge('確認済み'):`<button class="btn" data-staff-action="verify" data-id="${E(r.id)}">${I('check',15)}確認済みにする</button>`}</div>`:''}<div class="staff-dialog-actions"><button class="btn" data-staff-action="reason" data-id="${E(r.id)}">差し戻す</button><button class="btn primary" data-staff-action="approve" data-id="${E(r.id)}" ${need&&!need.done?'disabled':''}>${I('check',16)}承認する</button></div>`:''}</div>`);
  }
  D.reviewRequest=review;
  function approve(r){
    const check=requiredCheck(r);if(r.status!=='pending'||(check&&!check.done))return;
    r.status='approved';
    if(r.type==='meal' && typeof r.mealValue==='boolean'){
      const date=r.mealDate||r.date;
      if(date===today)S.mealChoices[r.studentId]=r.mealValue;
      else (S.datedMealChoices[date]??={})[r.studentId]=r.mealValue;
    }
    if(r.type==='leave' && isAway(r.studentId) && S.attendance[r.studentId]==='未確認')S.attendance[r.studentId]='外泊';
    D.save();D.closeDialog();D.render();D.notify('申請を承認しました');
  }
  function rollRows(){
    const query=rollQuery.trim().replace(/[\s　]/g,'').toLowerCase();
    const items=S.residents.filter(p=>(rollFilter==='all'||S.attendance[p.id]===rollFilter)&&(rollRoom==='all'||p.room===rollRoom)&&(planFilter==='all'||(planFilter==='out')===isAway(p.id))&&(p.name+p.room).replace(/[\s　]/g,'').toLowerCase().includes(query));
    return `<p class="staff-list-count" aria-live="polite">${items.length}人を表示</p>${items.length?`<div class="staff-scroll"><table class="staff-table roll-table"><thead><tr><th>部屋</th><th>寮生</th><th>今夜の予定</th><th>点呼の記録</th></tr></thead><tbody>${items.map(p=>
      `<tr><td class="staff-room-no">${E(p.room)}</td><td>${labelPerson(p)}</td><td>${badge(planLabel(p.id),isAway(p.id)?'neutral':'')}</td><td><select data-staff-attend="${p.id}" aria-label="${E(p.name)}の点呼">${['未確認','在寮','外泊'].map(s=>`<option ${S.attendance[p.id]===s?'selected':''}>${s}</option>`).join('')}</select></td></tr>`).join('')}</tbody></table></div>`:'<p class="empty">条件に合う寮生はいません。</p>'}`;
  }
  function rollPage(){
    const total=S.residents.length,checked=S.residents.filter(p=>S.attendance[p.id]!=='未確認').length;
    const rset=[...new Set(S.residents.map(p=>p.room))].sort();
    return `<div class="staff-screen"><header class="page-head"><div><p class="eyebrow">11月17日（火） · 当直 山田先生</p><h1>夜の点呼</h1></div>${printButton()}</header><div class="roll-progress"><div>${I('check-circle',20)}<strong>${E(S.settings.rollTime)} の点呼</strong><span>${checked} / ${total}人 確認済み</span></div><progress value="${checked}" max="${total}">${checked}人</progress></div><section class="panel staff-panel">${cardHead('点呼表')}<div class="staff-filterbar"><div class="staff-tabs">${['all','未確認','在寮','外泊'].map(k=>`<button data-staff-rollfilter="${k}" aria-pressed="${rollFilter===k}">${k==='all'?'全員':k}</button>`).join('')}</div><div class="staff-roll-tools"><select aria-label="在寮予定で絞り込み" data-staff-planfilter><option value="all">すべての予定</option><option value="in" ${planFilter==='in'?'selected':''}>在寮予定</option><option value="out" ${planFilter==='out'?'selected':''}>外泊予定</option></select><input type="search" data-staff-rollquery aria-label="点呼表を検索" placeholder="氏名・部屋番号" value="${E(rollQuery)}"><select aria-label="部屋で絞り込み" data-staff-rollroom><option value="all">すべての部屋</option>${rset.map(k=>`<option value="${k}" ${rollRoom===k?'selected':''}>${k}号室</option>`).join('')}</select></div></div><div id="staff-roll-list">${rollRows()}</div></section></div>`;
  }
  D.register('roll',rollPage);
  function printRoll(){
    document.getElementById('print-roll').innerHTML=`<h1>青葉寮　夜の点呼表</h1><p>2026年11月17日（火） ${E(S.settings.rollTime)} ／ 当直 山田先生</p><table><thead><tr><th>部屋</th><th>寮生</th><th>予定</th><th>点呼の記録</th><th>確認・備考</th></tr></thead><tbody>${[...S.residents].sort((a,b)=>a.room.localeCompare(b.room)).map(p=>`<tr><td>${E(p.room)}</td><td>${E(p.name)}</td><td>${isAway(p.id)?'外泊':E(returnPlan(p.id)?.expectedTime||'在寮')}</td><td>${E(S.attendance[p.id])}</td><td>　</td></tr>`).join('')}</tbody></table>`;
    window.print();
  }
  document.addEventListener('click',event=>{
    const jump=event.target.closest('[data-staff-focus]');
    if(jump){
      const focus=jump.dataset.staffFocus;
      if(focus==='pending'){requestTab='pending';requestType='all';}
      if(focus==='in'||focus==='out'){planFilter=focus;rollFilter='all';rollRoom='all';rollQuery='';}
    }
    const t=event.target.closest('button');if(!t)return;
    const {staffAction:a,id,staffTab,staffRollfilter}=t.dataset;
    if(staffTab){requestTab=staffTab;D.render();return;}
    if(staffRollfilter){rollFilter=staffRollfilter;D.render();return;}
    if(!a)return;
    if(a==='print'){printRoll();return;}
    const r=S.requests.find(x=>x.id===id);if(!r)return;
    if(a==='review')review(id);
    if(r.status!=='pending')return;
    if(a==='verify'){
      const check=requiredCheck(r);if(check){r[check.key]=true;D.save();D.render();review(id);}
    }
    if(a==='approve')approve(r);
    if(a==='reason')D.openDialog('差し戻しの理由',`<form data-staff-reject="${E(id)}"><label class="staff-input-label">寮生へのコメント<textarea name="note" required maxlength="240" rows="3" placeholder="修正してほしい内容を記入"></textarea></label><div class="staff-dialog-actions"><button type="button" class="btn" data-staff-action="review" data-id="${E(id)}">戻る</button><button class="btn primary">差し戻す</button></div></form>`);
  });
  document.addEventListener('change',event=>{
    const t=event.target;
    if(t.matches('[data-staff-planfilter]')){planFilter=t.value;D.render();}
    if(t.matches('[data-staff-type]')){requestType=t.value;D.render();}
    if(t.matches('[data-staff-rollroom]')){rollRoom=t.value;D.render();}
    if(t.matches('[data-staff-attend]')){S.attendance[t.dataset.staffAttend]=t.value;D.save();D.render();D.notify('点呼を記録しました');}
    if(t.matches('[data-staff-duty]')){const d=S.duties.find(x=>x.id===t.dataset.staffDuty);if(d){d.done=t.checked;D.save();D.render();D.notify('当直の業務を更新しました');}}
  });
  document.addEventListener('input',event=>{
    const t=event.target;
    if(t.matches('[data-staff-rollquery]')){rollQuery=t.value;document.getElementById('staff-roll-list').innerHTML=rollRows();}
    if(t.matches('[data-staff-reject] textarea'))t.setCustomValidity('');
  });
  document.addEventListener('submit',event=>{
    const form=event.target.closest('[data-staff-reject]');if(!form)return;
    event.preventDefault();const r=S.requests.find(x=>x.id===form.dataset.staffReject && x.status==='pending');if(!r)return;
    const note=form.elements.note.value.trim();if(!note){form.elements.note.setCustomValidity('理由を記入してください。');form.elements.note.reportValidity();return;}
    r.status='rejected';r.reviewNote=note;D.save();D.closeDialog();D.render();D.notify('コメントを付けて差し戻しました');
  });
})();

</script>
<script>
(() => {
  "use strict";
  const D = window.DD, esc = D.esc;
  const menus = [
    { date: '2026-11-17', weekday: '火', dish: 'チキン南蛮', sides: '千切りキャベツ・ごはん・みそ汁' },
    { date: '2026-11-18', weekday: '水', dish: '鮭の塩焼き', sides: 'ひじきの煮物・ごはん・すまし汁' },
    { date: '2026-11-19', weekday: '木', dish: '豚肉の生姜焼き', sides: '小松菜のおひたし・ごはん・みそ汁' },
    { date: '2026-11-20', weekday: '金', dish: '野菜カレー', sides: 'グリーンサラダ・フルーツヨーグルト' }
  ];
  D.menus = menus;
  let chosen = D.TODAY, filter = 'all', search = '', page = 0;
  const pageSize = 8;
  const filters = { all: 'すべて', booked: '提供予定', out: '欠食・未予約', pickup: '取り置き', pending: '確認待ち' };
  function booked(date, id) {
    if (date === D.TODAY) return Boolean(D.state.mealChoices[id]);
    return Boolean(D.state.datedMealChoices?.[date]?.[id] ?? D.state.mealDefaults?.[id] ?? D.state.mealChoices[id]);
  }
  D.isDinnerBooked = booked;

  function dinnerPickup(date, id) {
    if (!booked(date, id)) return null;
    const latest = D.state.requests.find(r => r.type === 'meal' && (r.mealDate || r.date) === date &&
      r.studentId === id && r.status === 'approved' && (r.kind === 'pickup' || r.mealValue === false));
    return latest?.kind === 'pickup' ? latest : null;
  }
  D.dinnerPickup = dinnerPickup;

  function kitchenData() {
    const s = D.state;
    const queue = s.requests.filter(r => r.type === 'meal' && (r.mealDate || r.date) === chosen);
    const pending = queue.filter(r => r.status === 'pending');
    const normalized = search.trim().replace(/[\s　]+/g, '').toLowerCase();
    const rows = s.residents.map(person => {
      const attending = booked(chosen, person.id);
      const pickup = dinnerPickup(chosen, person.id);
      const waiting = pending.filter(r => r.studentId === person.id);
      return {person, attending, waiting, pickup, collected: pickup ? Boolean(s.kitchenCollected?.[pickup.id]) : false};
    }).sort((a,b) => Number(a.person.room)-Number(b.person.room) || a.person.name.localeCompare(b.person.name,'ja'));
    const shown = rows.filter(row => {
      if (normalized && !(row.person.room + row.person.name).replace(/[\s　]+/g, '').toLowerCase().includes(normalized)) return false;
      if (filter === 'booked') return row.attending;
      if (filter === 'out') return !row.attending;
      if (filter === 'pickup') return row.pickup;
      if (filter === 'pending') return row.waiting.length > 0;
      return true;
    });
    return {
      rows, shown, pending,
      orders: rows.filter(r => r.attending).length,
      pickups: rows.filter(r => r.pickup).sort((a,b) => (a.pickup.pickup || '').localeCompare(b.pickup.pickup || ''))
    };
  }

  const tag = (text, color = '') => '<span class="kt-tag ' + color + '">' + esc(text) + '</span>';
  function requestButton(request) {
    return '<button type="button" class="kt-action" data-kt-review="' + esc(request.id) + '">' + D.icon('chevron-right',15) + '確認</button>';
  }

  function infoLists(data) {
    const pendingRows = data.pending.map(r => {
      const resident = D.state.residents.find(p => p.id === r.studentId);
      return '<li><div><b>' + esc(resident?.name || '寮生') + '</b><small>' + esc((resident?.room || '') + '号室 ・ ' + r.title) + '</small></div>' + requestButton(r) + '</li>';
    }).join('');
    const pickupRows = data.pickups.map(({person,pickup,collected}) => '<li><div><b>' + esc(pickup.pickup || '時刻未定') + '　' + esc(person.name) + '</b><small>' + esc(person.room) + '号室 · ' + (collected ? '受け渡し済み' : '受け渡し前') + '</small></div><button type="button" class="kt-action" data-kt-collect="' + esc(pickup.id) + '">' + (collected ? '取消' : '手渡し完了') + '</button></li>').join('');
    return '<div class="kt-info"><section class="panel"><h2>' + D.icon('clipboard',18) + '確認待ちの申請 <span>' + data.pending.length + '件</span></h2>' + (pendingRows ? '<ul>' + pendingRows + '</ul>' : '<p class="kt-quiet">確認待ちの食事申請はありません。</p>') + '</section><section class="panel"><h2>' + D.icon('clock',18) + '取り置きの受け渡し <span>' + data.pickups.length + '食</span></h2>' + (pickupRows ? '<ul>' + pickupRows + '</ul>' : '<p class="kt-quiet">この日の取り置きはありません。</p>') + '</section></div>';
  }

  function tableBody(data) {
    const pages = Math.max(1,Math.ceil(data.shown.length/pageSize));

  }

  function refreshTable() { const el=document.getElementById('kt-results'); if(el) el.innerHTML=tableBody(kitchenData()); }
  function downloadCsv() {
    const data = kitchenData();
    const records = [['提供日','居室','寮生','夕食','取り置き','受け渡し','確認中の申請'], ...data.shown.map(({person,attending,pickup,collected,waiting}) => [chosen,person.room,person.name,attending?'提供予定':'欠食・未予約',pickup?.pickup || '',pickup?(collected?'受け渡し済み':'受け渡し前'):'',waiting.map(r=>r.title).join('・')])];
    const quote = value => {
      let s = String(value ?? '');
      if (/^[=+@\-\t\r]/.test(s)) s="'"+s;
      return '"' + s.replaceAll('"','""') + '"';
    };
    const blob = new Blob(['\uFEFF', records.map(row => row.map(quote).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'});
    const url = URL.createObjectURL(blob), link = document.createElement('a');
    link.href = url; link.download = '青葉寮_夕食名簿_' + chosen + '.csv';
    document.body.append(link); link.click(); link.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1500);
    D.notify(data.shown.length + '人分の名簿をCSV出力しました');
  }

  document.addEventListener('click', event => {
    const date = event.target.closest('[data-kt-date]')?.dataset.ktDate;
    if (date && menus.some(m => m.date === date)) { chosen=date;page=0;D.render();return; }
    const review = event.target.closest('[data-kt-review]')?.dataset.ktReview;
    if (review) {D.reviewRequest(review);return;}
    const collect = event.target.closest('[data-kt-collect]')?.dataset.ktCollect;
    if (collect) {
      const item = kitchenData().pickups.find(row=>row.pickup.id===collect);
      if (!item) return;
      D.state.kitchenCollected ||= {};
      D.state.kitchenCollected[collect] = !item.collected;
      D.save();D.render();D.notify(item.collected?'受け渡しの記録を取り消しました':'取り置きの受け渡しを記録しました');
      return;
    }
    const delta = event.target.closest('[data-kt-page]')?.dataset.ktPage;
    if (delta) { page=Math.max(0,page+Number(delta));refreshTable();return; }
    if (event.target.closest('[data-kt-export]')) downloadCsv();
  });
  document.addEventListener('input',event=>{if(event.target.matches('[data-kt-search]')){search=event.target.value;page=0;refreshTable();}});
  document.addEventListener('change',event=>{if(event.target.matches('[data-kt-filter]')){filter=event.target.value;page=0;refreshTable();}});
  D.register('meals',screen);
})();

      <div class="settings-layout">
        <form id="settings-form" class="panel settings-form">
          <section class="settings-section"><h2>この学校で使う機能</h2><p class="settings-sub">保存すると職員・寮生のメニューに反映されます。オフにした機能の記録は保持され、オンに戻すと再び表示されます。</p>
            ${modules.map(f => switchRow(f, D.moduleOn(f.name))).join('')}</section>
          <section class="settings-section"><h2>夜の点呼</h2><div class="settings-row settings-time">
            <div><label for="settings-roll"><strong>点呼時刻</strong></label><small id="settings-roll-help">職員の点呼表と寮生の「今日の予定」に表示します。</small></div>
            <input id="settings-roll" aria-describedby="settings-roll-help" type="time" name="rollTime" min="00:00" max="23:59" step="60" required value="${D.esc(s.rollTime)}"></div></section>
          <section class="settings-section"><h2>申請の承認手順</h2><p class="settings-sub">保存すると、確認待ちの申請と、これから届く申請に適用されます。</p>
            ${fields.map(f => switchRow(f, s[f.name])).join('')}</section>
          <div class="settings-save"><span role="status" id="settings-dirty"></span><button class="btn primary" type="submit" disabled>変更を保存</button></div>
        </form>
        <aside class="panel settings-demo"><div class="settings-icon">${D.icon('school',22)}</div><h2>デモの学校</h2><dl><div><dt>学校寮</dt><dd>青葉寮（架空）</dd></div>
          <div><dt>基準日</dt><dd><time datetime="2026-11-17">2026年11月17日（火）</time></dd></div></dl>
          <p>どの画面も同じ基準日で操作できます。変更した内容はこのブラウザに保存されます。</p>
          <button type="button" class="btn" data-settings-reset>初期データに戻す</button></aside>
      </div></div>`;
  }
  D.register('settings', settingsPage);

  function updateDirty(form) {
    const saved = D.state.settings;
    const changed = form.elements.rollTime.value !== saved.rollTime ||
      fields.some(({ name }) => form.elements[name].checked !== saved[name]) ||
      modules.some(({ name }) => form.elements[name].checked !== D.moduleOn(name));
    form.querySelector('button[type="submit"]').disabled = !changed;
    form.querySelector('#settings-dirty').textContent = changed ? '未保存の変更があります' : '';
  }

  document.addEventListener('input', e => {
    if (e.target.form?.id === 'settings-form') updateDirty(e.target.form);
  });
  document.addEventListener('submit', e => {
    const form = e.target;
    if (form.id !== 'settings-form') return;
    e.preventDefault();
    if (!form.reportValidity()) return;
    const time = form.elements.rollTime.value;
    if (!/^([01]\d|2[0-3]):[0-5]\d$/.test(time)) return;
    D.state.settings.rollTime = time;
    for (const field of fields) D.state.settings[field.name] = form.elements[field.name].checked;
    const selections = D.state.settings.modules || {};
    for (const mod of modules) selections[mod.name] = form.elements[mod.name].checked;
    D.state.settings.modules = selections;
    D.save();
    D.render();
    D.notify('学校の運用ルールを保存しました');
  });
  document.addEventListener('click', e => {
    if (e.target.closest('[data-settings-reset]')) {
      D.openDialog('デモを初期データに戻しますか？', `<p class="settings-confirm-note">このブラウザで追加した申請、点呼・部屋割りの記録、学校設定を含むすべての変更が消え、最初のサンプルに戻ります。</p>
        <div class="settings-dialog-actions"><button type="button" class="btn" data-settings-cancel autofocus>キャンセル</button><button type="button" class="btn settings-destructive" data-settings-confirm>初期データに戻す</button></div>`);
    } else if (e.target.closest('[data-settings-cancel]')) {
      D.closeDialog();
    } else if (e.target.closest('[data-settings-confirm]')) {
      D.resetDemo();
    }
  });
})();

</script>
<script>
(() => {
  'use strict';

  const D = window.DD;
  const S = () => D.state;
  const e = value => D.esc(String(value ?? ''));
  const day = '2026-11-17';
  const {min: winterStart, max: winterEnd} = D.winterBreak;
  const labels = {pending: '確認待ち', approved: '承認済み', rejected: '差し戻し'};
  const views = {
    residents: {query: '', grade: 'all'},
    vacations: {query: '', status: 'all'},
    repairs: {status: 'all'},
    billing: {status: 'all'}
  };

  const byId = (list, id) => list.find(item => String(item.id) === String(id));
  const resident = id => byId(S().residents, id);
  const planFor = id => S().vacationPlans[id];
  const money = n => '¥' + new Intl.NumberFormat('ja-JP').format(n);
  const makeId = prefix => prefix + '-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
  const compact = value => String(value || '').normalize('NFKC').replace(/[\s　]+/g, '').toLowerCase();
  const matches = (r, query) => [r.name, r.room, r.room + '号室'].some(value => compact(value).includes(compact(query)));
  const fmtDate = date => {
    const m = String(date || '').match(/^(\d{4})-(\d{2})-(\d{2})$/);
    return m ? Number(m[2]) + '/' + Number(m[3]) : String(date || '—');
  };
  const badge = (text, tone = '') => '<span class="op-badge ' + tone + '">' + e(text) + '</span>';
  const button = (action, label, id = '', variant = '') => `<button type="button" class="op-button ${variant}" data-op-action="${action}" data-op-id="${e(id)}">${e(label)}</button>`;
  const empty = text => '<div class="op-empty">' + e(text) + '</div>';
  const options = (list, value) => list.map(([v, label]) => `<option value="${e(v)}" ${String(v) === String(value) ? 'selected' : ''}>${e(label)}</option>`).join('');
  const selectResidents = (selected, blank = false) => (blank ? '<option value="">寮生を選択</option>' : '') + options(S().residents.map(r => [r.id, r.name + ' ・ ' + r.room + '号室']), selected);
  const profileMark = r => `<span class="op-avatar op-color-${(Number(r.grade) || 1) % 3}" aria-hidden="true">${e(Array.from(r.name.trim())[0])}</span>`;
  const stat = (label, value, unit, tone = '') => `<div class="op-stat ${tone}"><span>${e(label)}</span><strong>${e(value)}<small>${e(unit)}</small></strong></div>`;
  const page = (title, meta, action, body) => `<div class="op-page"><div class="op-heading"><div><p class="op-kicker">${e(meta)}</p><h1>${e(title)}</h1></div>${action || ''}</div>${body}</div>`;
  const card = (title, meta, body, extra = '') => `<section class="op-card ${extra}"><div class="op-card-head"><h2>${e(title)}</h2>${meta ? '<span>' + e(meta) + '</span>' : ''}</div>${body}</section>`;
  const field = (label, control) => `<label class="op-field"><span>${e(label)}</span>${control}</label>`;
  const form = (key, content, label, id = '') => `<form class="op-form" data-op-form="${key}" data-op-id="${e(id)}">${content}<div class="op-actions">${button('close', 'キャンセル')}<button type="submit" class="op-button primary">${e(label)}</button></div></form>`;
  const footers = text => '<p class="op-form-note">' + e(text) + '</p>';
  const save = message => { D.save(); D.render(); D.notify(message); };
  const finish = message => { D.closeDialog(); save(message); };
  const residentName = id => resident(id)?.name || '寮生';
  const filterBar = (route, choices, current) => `<div class="op-filters" role="group" aria-label="表示する状態">${choices.map(([v, label]) => `<button type="button" class="op-filter ${current === v ? 'active' : ''}" aria-pressed="${current === v}" data-op-filter="${e(route)}" data-op-value="${e(v)}">${e(label)}</button>`).join('')}</div>`;
  const searchBar = (route, extra) => `<div class="op-tools"><label class="op-search"><span aria-hidden="true">⌕</span><input type="search" aria-label="氏名・部屋番号で検索" data-op-search="${route}" value="${e(views[route].query)}" placeholder="氏名・部屋番号で検索"></label>${extra || ''}</div>`;

  function residentRows() {
    const filter = views.residents;
    const filtered = S().residents.filter(r => matches(r, filter.query) && (filter.grade === 'all' || String(r.grade) === filter.grade));
    return `<p class="op-count" aria-live="polite">${filtered.length}人を表示</p>` + (filtered.length ? `<div class="op-table-scroll"><table class="op-table"><thead><tr><th>寮生</th><th>部屋</th><th>学年</th><th>点呼</th><th><span class="op-sr">操作</span></th></tr></thead><tbody>${filtered.map(r => {
      const status = S().attendance[r.id] || '未確認';
      return `<tr><td><div class="op-person">${profileMark(r)}<strong>${e(r.name)}</strong></div></td><td>${e(r.room)}号室</td><td>${e(r.grade)}年</td><td>${badge(status, status === '未確認' ? 'sand' : status === '在寮' ? 'mint' : '')}</td><td>${button('profile', '詳細', r.id, 'small')}</td></tr>`;
    }).join('')}</tbody></table></div>` : empty('条件に合う寮生はいません。'));
  }

  D.register('residents', () => {
    const residents = S().residents;
    const rooms = new Set(residents.map(r => r.room)).size;
    const grades = [...new Set(residents.map(r => r.grade))].sort((a, b) => a - b);
    const filters = `<select data-op-select="grade" aria-label="学年で絞り込み">${options([['all','すべての学年'], ...grades.map(g => [g, g + '年'])], views.residents.grade)}</select>`;
    return page('寮生名簿', '青葉寮 · 寮生管理', '', card('登録寮生', residents.length + '人 ／ ' + rooms + '部屋', searchBar('residents', filters) + '<div data-op-list="residents">' + residentRows() + '</div>'));
  });

  function openProfile(id) {
    const r = resident(id);
    if (!r) return;
    const requests = S().requests.filter(item => item.studentId === id);
    const outstanding = S().bills.filter(item => item.studentId === id && !item.paid).reduce((v, b) => v + Number(b.amount), 0);
    const plan = planFor(id);
    const listItem = (label, value) => `<div><dt>${e(label)}</dt><dd>${e(value)}</dd></div>`;
    const requestList = requests.length ? requests.slice(0,4).map(item => `<div class="op-profile-request"><span>${e(item.title)}</span>${badge(labels[item.status] || item.status, item.status === 'pending' ? 'sand' : '')}</div>`).join('') : empty('申請の記録はありません。');
    D.openDialog('寮生の詳細', `<div class="op-profile"><div class="op-profile-name">${profileMark(r)}<div><strong>${e(r.name)}</strong><small>${e(r.grade)}年 ・ ${e(r.room)}号室</small></div></div>
      <dl class="op-details">${listItem('今夜の点呼', S().attendance[id] || '未確認')}${listItem('冬休みの予定', plan ? fmtDate(plan.start) + '〜' + fmtDate(plan.end) + ' ・ ' + plan.destination : '未提出')}${D.moduleOn('billing') ? listItem('未入金額', money(outstanding)) : ''}</dl>
      <h3>申請の記録</h3>${requestList}<div class="op-actions">${button('close', '閉じる')}</div></div>`);
  }

  function vacationRows() {
    const filter = views.vacations;
    const filtered = S().residents.filter(r => matches(r, filter.query) && (filter.status === 'all' || (filter.status === 'registered') === !!planFor(r.id)));
    return `<p class="op-count" aria-live="polite">${filtered.length}人を表示</p>` + (filtered.length ? `<div class="op-table-scroll"><table class="op-table"><thead><tr><th>寮生</th><th>滞在先</th><th>期間</th><th>提出状況</th><th><span class="op-sr">操作</span></th></tr></thead><tbody>${filtered.map(r => {
      const p = planFor(r.id);
      return `<tr><td><div class="op-person">${profileMark(r)}<div><strong>${e(r.name)}</strong><small>${e(r.room)}号室</small></div></div></td><td>${e(p?.destination || '—')}</td><td>${p ? e(fmtDate(p.start) + '〜' + fmtDate(p.end)) : '—'}</td><td>${p ? badge('提出済み','mint') : badge('未提出','sand')}</td><td>${button('vacation-edit', p ? '編集' : '登録', r.id, 'small')}</td></tr>`;
    }).join('')}</tbody></table></div>` : empty('条件に合う寮生はいません。'));
  }

  D.register('vacations', () => {
    const all = S().residents.length;
    const submitted = S().residents.filter(r => planFor(r.id)).length;
    const filters = `<select data-op-select="vacation-status" aria-label="提出状況で絞り込み">${options([['all','すべての提出状況'],['registered','提出済み'],['missing','未提出']], views.vacations.status)}</select>`;
    return page('長期休暇', '青葉寮 · 2026年度 冬休み', '', `<div class="op-stats">${stat('対象の寮生',all,'人')}${stat('予定を提出',submitted,'人','green')}${stat('未提出',all-submitted,'人','amber')}</div>` +
      card('冬休みの滞在予定', '2026年12月〜2027年1月', searchBar('vacations', filters) + '<div data-op-list="vacations">' + vacationRows() + '</div>'));
  });

  function openVacation(id) {
    const r = resident(id);
    if (!r) return;
    const p = planFor(id) || {start: D.winterBreak.start, end: D.winterBreak.end, destination: ''};
    D.openDialog('冬休みの滞在予定', form('vacation', `<p class="op-subject">${e(r.name)} <small>${e(r.room)}号室</small></p><div class="op-form-grid">
      ${field('開始日', `<input type="date" name="start" required min="${winterStart}" max="${winterEnd}" value="${e(p.start)}">`)}${field('終了日', `<input type="date" name="end" required min="${e(p.start >= winterStart ? p.start : winterStart)}" max="${winterEnd}" value="${e(p.end)}">`)}</div>` +
      field('滞在先', `<input name="destination" placeholder="例：実家、青葉寮" maxlength="60" required value="${e(p.destination)}">`) + footers('2026年12月1日〜2027年1月31日の範囲で登録できます。登録した予定は寮生側にも表示されます。'), '予定を保存', id));
  }

  function dutiesPage() {
    const duties = S().duties;
    const complete = duties.filter(t => t.done).length;
    const tasks = duties.length ? `<ul class="op-task-list">${duties.map(t => `<li><label class="op-check"><input type="checkbox" data-op-check="${e(t.id)}" ${t.done ? 'checked' : ''}><span><strong>${e(t.title)}</strong><small>${e(t.when)} ・ ${e(t.owner)}</small></span></label></li>`).join('')}</ul>` : empty('今日の当番はありません。');
    const notes = S().handovers.length ? '<ul class="op-notes">' + S().handovers.map(h => `<li><span class="op-note-marker"></span><div><div class="op-note-meta"><strong>${e(h.by)}</strong><span>${e(h.time)}</span></div><p>${e(h.text)}</p></div></li>`).join('') + '</ul>' : empty('引継ぎの記録はありません。');
    return page('当直・引継ぎ', '11月17日（火） · 青葉寮', button('handover-add','引継ぎを書く','','primary'), `<div class="op-split">${card('今日の当番',complete + ' / ' + duties.length + ' 件完了', '<div class="op-progress" aria-hidden="true"><i style="width:' + (duties.length ? Math.round(complete * 100 / duties.length) : 0) + '%"></i></div>' + tasks + '<div class="op-card-footer">' + button('duty-add','当番を追加') + '</div>')}${card('職員の引継ぎノート',S().handovers.length + '件',notes)}</div>`);
  }
  D.register('duties', dutiesPage);

  function openDuty() {
    D.openDialog('当番を追加', form('duty', field('業務名', '<input name="title" maxlength="70" required placeholder="例：食堂の施錠確認">') + `<div class="op-form-grid">${field('担当', '<input name="owner" required maxlength="40" placeholder="例：203号室">')}${field('予定時刻', '<input type="time" name="when" required value="20:30">')}</div>`, '当番を追加'));
  }
  function openHandover() {
    D.openDialog('引継ぎを書く', form('handover', field('次の当直者への連絡', '<textarea name="text" rows="4" maxlength="600" required placeholder="要確認の事柄や対応済みの内容"></textarea>') + footers('山田先生の名前で引継ぎノートに記録します。'), 'ノートに記録'));
  }

  const repairStatuses = ['未対応','対応中','完了'];
  const repairTone = status => status === '未対応' ? 'sand' : status === '完了' ? 'mint' : 'sky';
  function repairsPage() {
    const all = S().repairs;
    const choices = [['all', 'すべて ' + all.length], ...repairStatuses.map(s => [s, s + ' ' + all.filter(r => r.status === s).length])];
    const filtered = all.filter(r => views.repairs.status === 'all' || r.status === views.repairs.status);
    const body = filtered.length ? '<ul class="op-repairs">' + filtered.map(r => `<li><div class="op-repair-top"><strong>${e(r.place)}</strong>${badge(r.status, repairTone(r.status))}</div><p>${e(r.detail)}</p><div class="op-repair-foot"><small>${e(fmtDate(r.date))} 受付 ・ ${e(residentName(r.studentId))}</small>${button('repair-edit','対応を記録',r.id,'small')}</div></li>`).join('') + '</ul>' : empty('該当する設備報告はありません。');
    return page('設備・修繕', '青葉寮 · 建物管理', button('repair-add','設備報告を登録','','primary'), card('受付一覧','',filterBar('repairs',choices,views.repairs.status) + body));
  }
  D.register('repairs', repairsPage);

  function openRepair(id) {
    const r = byId(S().repairs, id);
    if (!r) return;
    D.openDialog('設備の対応を記録', form('repair-edit', `<p class="op-subject">${e(r.place)}</p><p class="op-detail-text">${e(r.detail)}</p>` + field('対応状況', `<select name="status">${options(repairStatuses.map(s => [s,s]),r.status)}</select>`) + footers('報告した寮生にも最新の対応状況を表示します。'), '状況を更新', id));
  }
  function openNewRepair() {
    D.openDialog('設備報告を登録', form('repair-add', field('報告した寮生', `<select name="studentId" required>${selectResidents('', true)}</select>`) + field('場所・設備', '<input name="place" required maxlength="60" placeholder="例：203号室のデスクライト">') + field('不具合の内容', '<textarea name="detail" required maxlength="400" rows="3"></textarea>'), '報告を登録'));
  }

  function billingPage() {
    const all = S().bills;
    const sum = (arr) => arr.reduce((v, b) => v + Number(b.amount), 0);
    const paid = all.filter(b => b.paid);
    const outstanding = all.length - paid.length;
    const filtered = all.filter(b => views.billing.status === 'all' || (views.billing.status === 'paid') === b.paid);
    const choices = [['all','すべて ' + all.length], ['unpaid','未入金 ' + outstanding], ['paid','入金済み ' + paid.length]];
    const rows = filtered.length ? `<div class="op-table-scroll"><table class="op-table"><thead><tr><th>寮生・費目</th><th>請求額</th><th>状態</th><th><span class="op-sr">操作</span></th></tr></thead><tbody>${filtered.map(b => `<tr><td><strong>${e(residentName(b.studentId))}</strong><small>${e(b.title)}</small></td><td class="op-money">${e(money(b.amount))}</td><td>${badge(b.paid ? '入金済み' : '未入金', b.paid ? 'mint' : 'sand')}</td><td>${button('payment', b.paid ? '入金の訂正' : '入金を記録',b.id,'small')}</td></tr>`).join('')}</tbody></table></div>` : empty('該当する請求はありません。');
    return page('請求・入金', '青葉寮 · 会計管理', button('bill-add','請求を追加','','primary'), `<div class="op-stats">${stat('請求総額',money(sum(all)),'')}${stat('入金済み',money(sum(paid)),'','green')}${stat('未入金',money(sum(all)-sum(paid)),'','amber')}</div>` + card('請求明細', '', filterBar('billing', choices, views.billing.status) + rows));
  }
  D.register('billing', billingPage);

  function openPayment(id) {
    const b = byId(S().bills, id);
    if (!b) return;
    const action = b.paid ? '未入金に戻す' : '入金済みにする';
    D.openDialog(b.paid ? '入金記録の訂正' : '入金の記録', form('payment', `<div class="op-payment"><span>${e(residentName(b.studentId))} ・ ${e(b.title)}</span><strong>${e(money(b.amount))}</strong></div>` + footers(b.paid ? 'この請求の入金記録を取り消します。' : '振込や現金の受領を確認した請求を入金済みにします。'), action, id));
  }
  function openBill() {
    D.openDialog('請求を追加', form('bill-add', field('対象の寮生', `<select required name="studentId">${selectResidents('', true)}</select>`) + field('費目', '<input name="title" maxlength="70" required placeholder="例：12月分 寮費">') + field('請求金額（円）', '<input type="number" name="amount" inputmode="numeric" min="1" max="9999999" step="1" required placeholder="30000">'), '請求を登録'));
  }

  const actions = {'close': () => D.closeDialog(), 'profile': openProfile, 'vacation-edit': openVacation, 'handover-add': openHandover, 'duty-add': openDuty, 'repair-edit': openRepair, 'repair-add': openNewRepair, 'payment': openPayment, 'bill-add': openBill};
  document.addEventListener('click', event => {
    const action = event.target.closest('[data-op-action]');
    if (action) actions[action.dataset.opAction]?.(action.dataset.opId);
    const filter = event.target.closest('[data-op-filter]');
    if (filter) { views[filter.dataset.opFilter].status = filter.dataset.opValue; D.render(); }
  });
  const refreshList = route => {
    const target = document.querySelector('[data-op-list="' + route + '"]');
    if (target) target.innerHTML = route === 'residents' ? residentRows() : vacationRows();
  };
  document.addEventListener('input', event => {
    const el = event.target;
    if (el.matches('[data-op-search]')) { const route = el.dataset.opSearch; views[route].query = el.value; refreshList(route); }
    if (el.matches('[data-op-form="vacation"] input[name="start"]')) el.form.elements.end.min = el.value >= winterStart ? el.value : winterStart;
    if (el.closest('[data-op-form]') && el.setCustomValidity) el.setCustomValidity('');
  });
  document.addEventListener('change', event => {
    const el = event.target;
    if (el.matches('[data-op-select="grade"]')) { views.residents.grade = el.value; refreshList('residents'); }
    if (el.matches('[data-op-select="vacation-status"]')) { views.vacations.status = el.value; refreshList('vacations'); }
    if (el.matches('[data-op-check]')) {
      const item = byId(S().duties, el.dataset.opCheck);
      if (item) { item.done = el.checked; save(item.done ? '当番を完了しました' : '当番を未完了に戻しました'); }
    }
  });
  document.addEventListener('submit', event => {
    const f = event.target;
    if (!f.matches('form[data-op-form]')) return;
    event.preventDefault();
    const v = Object.fromEntries([...new FormData(f)].map(([k, val]) => [k, String(val).trim()]));
    for (const el of f.querySelectorAll('[required]')) {
      if (!String(el.value).trim()) { el.setCustomValidity('内容を入力してください。'); el.reportValidity(); return; }
    }
    const s = S();
    const id = f.dataset.opId;
    switch (f.dataset.opForm) {
      case 'vacation':
        if (!resident(id) || v.start < winterStart || v.end > winterEnd || v.end < v.start) return;
        s.vacationPlans[id] = {start: v.start, end: v.end, destination: v.destination};
        finish('冬休みの予定を保存しました'); break;
      case 'duty':
        s.duties.push({id: makeId('d'), title:v.title, owner:v.owner, when:v.when, done:false});
        finish('当番を追加しました'); break;
      case 'handover':
        s.handovers.unshift({id: makeId('h'), text:v.text, by:'山田先生', time:'11/17 17:40'});
        finish('引継ぎを記録しました'); break;
      case 'repair-add':
        if (!resident(v.studentId)) return;
        s.repairs.unshift({id:makeId('r'),studentId:v.studentId,place:v.place,detail:v.detail,status:'未対応',date:day});
        views.repairs.status = 'all'; finish('設備報告を登録しました'); break;
      case 'repair-edit': {
        const item = byId(s.repairs, id);
        if (!item || !repairStatuses.includes(v.status)) return;
        item.status = v.status; finish('対応状況を更新しました'); break;
      }
      case 'bill-add': {
        const amount = Number(v.amount);
        if (!resident(v.studentId) || !Number.isInteger(amount) || amount <= 0) return;
        s.bills.unshift({id: makeId('b'),studentId:v.studentId,title:v.title,amount,paid:false});
        views.billing.status = 'all'; finish('請求を登録しました'); break;
      }
      case 'payment': {
        const item = byId(s.bills, id);
        if (!item) return;
        item.paid = !item.paid; finish(item.paid ? '入金を記録しました' : '未入金に戻しました'); break;
      }
    }
  });
})();

<script>
(() => {
  "use strict";
  const D = window.DD;
  const rooms = ["201", "202", "203", "204", "205", "206"];
  const options = { A: "移動を少なく", B: "同室希望を優先", C: "学年のバランス" };
  const effective = "2027-04-01";
  const e = value => D.esc(String(value));
  const symbols = {
    lock: '<rect x="5.5" y="10" width="13" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v2"/>',
    unlock: '<rect x="5.5" y="10" width="13" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 7.7-1.5"/>',
    shuffle: '<path d="M4 5h3c4.7 0 5.3 14 10 14h3m-3-3 3 3-3 3M4 19h3c1.4 0 2.5-1.4 3.6-3.4M14 8.5C15 6.4 16 5 17.5 5H20m-3-3 3 3-3 3"/>',
    check: '<path d="m5 12 4 4L19 6"/>',
    table: '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M10 4v16"/>',
    move: '<path d="M5 8h13m-3-3 3 3-3 3M19 16H6m3 3-3-3 3-3"/>'
  };
  const svg = (name, size = 16) => '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + symbols[name] + '</svg>';
  const clonePlan = plan => Object.fromEntries(rooms.map(room => [room, plan[room].slice()]));

  function roster() {
    const people = D.state.residents.filter(person => rooms.includes(String(person.room)));
    const byId = new Map(people.map(person => [person.id, person]));
    const home = Object.fromEntries(rooms.map(room => [room, people.filter(p => String(p.room) === room).map(p => p.id)]));
    const partner = new Map();
    for (let i = 0; i < rooms.length; i += 2) {
      const a = home[rooms[i]], b = home[rooms[i + 1]];
      if (!b.length) continue;
      a.slice(0, b.length).forEach((id, j) => {
        const other = b[(j + 1) % b.length];
        partner.set(id, other);
        partner.set(other, id);
      });
    }
    return { people, byId, home, partner, gradeCount: new Set(people.map(p => p.grade)).size };
  }

  function roomMetrics(group, room, data) {
    const grades = new Set();
    let moves = 0, paired = 0, oldPairs = 0;
    for (let i = 0; i < group.length; i++) {
      const id = group[i], student = data.byId.get(id);
      grades.add(student.grade);
      if (String(student.room) !== room) moves++;
      for (let j = 0; j < i; j++) {
        const other = group[j];
        if (data.partner.get(id) === other) paired++;
        if (String(data.byId.get(other).room) === String(student.room)) oldPairs++;
      }
    }
    return { moves, paired, oldPairs, distinct: grades.size, mixed: Number(grades.size >= Math.min(data.gradeCount, group.length)) };
  }

  function totals(plan, data) {
    const total = { moves: 0, paired: 0, oldPairs: 0, mixed: 0 };
    for (const room of rooms) {
      const m = roomMetrics(plan[room], room, data);
      for (const key of Object.keys(total)) total[key] += m[key];
    }
    return total;
  }

  function randomSource(seed) {
    let n = seed >>> 0;
    return () => ((n = (Math.imul(n, 1664525) + 1013904223) >>> 0) / 4294967296);
  }

  function createCandidate(option, config, data) {
    const random = randomSource(7117 + config.seed * 109 + option.charCodeAt(0) * 31);
    const freeRooms = rooms.filter(room => !config.locks[room]);
    const used = new Set(Object.values(config.locks).flat());
    const pool = data.people.map(p => p.id).filter(id => !used.has(id));
    const map = {};
    for (const room of rooms) {
      if (config.locks[room]) map[room] = config.locks[room].slice();
      else map[room] = data.home[room].filter(id => !used.has(id));
    }
    const placed = new Set(Object.values(map).flat());
    const rest = pool.filter(id => !placed.has(id));
    for (const room of freeRooms) {
      while (map[room].length < data.home[room].length && rest.length) map[room].push(rest.shift());
    }
    if (freeRooms.length < 2) return map;
    function score(room) {
      const m = roomMetrics(map[room], room, data);
      const moveWeight = option === "A" ? 6.8 : option === "B" ? .65 : 1;
      const pairWeight = option === "B" ? 23 : option === "A" ? 2 : 2.5;
      const mixWeight = config.mix ? (option === "C" ? 10 : 2.8) : 0;
      const oldWeight = config.avoid ? (option === "A" ? 2 : 3.5) : 0;
      return -moveWeight * m.moves + pairWeight * m.paired + mixWeight * (m.distinct + m.mixed) - oldWeight * m.oldPairs;
    }
    let current = rooms.reduce((sum, room) => sum + score(room), 0);
    let best = current, result = clonePlan(map);
    for (let i = 0; i < 2400; i++) {
      const x = Math.floor(random() * freeRooms.length);
      const y = (x + 1 + Math.floor(random() * (freeRooms.length - 1))) % freeRooms.length;
      const a = freeRooms[x], b = freeRooms[y];
      if (!map[a].length || !map[b].length) continue;
      const u = Math.floor(random() * map[a].length), v = Math.floor(random() * map[b].length);
      const before = score(a) + score(b);
      [map[a][u], map[b][v]] = [map[b][v], map[a][u]];
      const diff = score(a) + score(b) - before;
      const heat = 3.3 * (1 - i / 2400) + .05;
      if (diff >= 0 || random() < Math.exp(diff / heat)) {
        current += diff;
        if (current > best + .001 || (Math.abs(current - best) < .001 && random() < .04)) {
          best = current;
          result = clonePlan(map);
        }
      } else {
        [map[a][u], map[b][v]] = [map[b][v], map[a][u]];
      }
    }
    return result;
  }

  function buildAll(config, data) {
    config.plans = Object.fromEntries(Object.keys(options).map(k => [k, createCandidate(k, config, data)]));
  }

  function configFor(data) {
    const key = data.people.map(p => [p.id, p.room, p.grade]).join("|");
    let config = D.state.roomPlan;
    if (!config || config.rosterKey !== key) {
      config = { rosterKey: key, seed: 1, active: "A", mix: true, avoid: true, locks: {}, plans: {}, confirmed: null };
      buildAll(config, data);
      D.state.roomPlan = config;
      D.save();
    }
    return config;
  }

  function metricsHtml(plan, data) {
    const v = totals(plan, data);
    return '<div class="rp-metrics">' + [
      [v.moves + '人', '現在の部屋から移動'],
      [v.paired + ' / ' + data.partner.size / 2 + '組', '同室希望が一致'],
      [v.mixed + ' / ' + rooms.length + '室', '全学年を含む部屋']
    ].map(([number, label]) => '<div><b>' + number + '</b><small>' + label + '</small></div>').join('') + '</div>';
  }

  function roomCard(room, config, data) {
    const group = config.plans[config.active][room];
    const locked = !!config.locks[room];
    const rows = group.map(id => {
      const p = data.byId.get(id);
      return '<button type="button" class="rp-person" data-rp-act="person" data-rp-val="' + e(id) + '" aria-label="' + e(p.name + 'の部屋割り詳細') + '"><span class="rp-avatar rp-grade-' + e(p.grade) + '">' + e(p.name.slice(0, 1)) + '</span><span class="rp-name">' + e(p.name) + '</span><span class="rp-year"><i class="rp-dot-' + e(p.grade) + '"></i>' + e(p.grade) + '年</span></button>';
    }).join('');
    return '<article class="rp-room' + (locked ? ' rp-locked' : '') + '"><header><strong>' + room + '<small>号室</small></strong><span>' + group.length + ' / 4人</span><button type="button" class="rp-pin" data-rp-act="pin" data-rp-val="' + room + '" aria-label="' + room + '号室の固定' + (locked ? 'を解除' : '') + '" aria-pressed="' + locked + '" title="' + (locked ? '固定を解除' : 'この部屋の割当を固定') + '">' + svg(locked ? 'lock' : 'unlock', 15) + (locked ? '<em>固定</em>' : '') + '</button></header>' + rows + '</article>';
  }

  function samePlan(a, b) {
    return rooms.every(room => a[room].slice().sort().join('|') === b[room].slice().sort().join('|'));
  }

  function workspace() {
    const data = roster(), c = configFor(data), plan = c.plans[c.active];
    const pinned = Object.keys(c.locks).length;
    const confirmed = c.confirmed && samePlan(c.confirmed.plan, plan);
    const gradeLabel = [...new Set(data.people.map(p => p.grade))].sort().join('・');
    return '<div class="rp-workspace"><div class="page-head rp-head"><div><div class="eyebrow">居室管理</div><h1>春の部屋替え</h1><p>2027年4月1日から適用 <span>·</span> ' + (confirmed ? '確定済み' : '下書き') + '</p></div><button type="button" class="btn primary rp-confirm-btn" data-rp-act="review">' + svg('check') + (confirmed ? '確定内容を見る' : 'この案を確認') + '</button></div>' +
      (c.confirmed && !confirmed ? '<div class="rp-reserved"><span>4月1日の割当は確定済みです。現在は別の案を表示しています。</span><button type="button" data-rp-act="reserved">確定内容を見る</button></div>' : '') +
      '<div class="rp-layout"><aside class="rp-controls"><h2>割り当ての条件</h2><dl><div><dt>対象フロア</dt><dd>東棟 2階</dd></div><div><dt>対象寮生</dt><dd>' + data.people.length + '人 <span>／ ' + e(gradeLabel) + '年</span></dd></div><div><dt>部屋定員</dt><dd>各4人 <span>／ ' + rooms.length + '室</span></dd></div></dl><div class="rp-settings"><label><span>学年を混ぜる</span><input data-rp-flag="mix" type="checkbox" role="switch"' + (c.mix ? ' checked' : '') + '></label><label><span>以前の同室者を分ける</span><input data-rp-flag="avoid" type="checkbox" role="switch"' + (c.avoid ? ' checked' : '') + '></label></div><div class="rp-fixed">' + svg('lock') + '<span>固定した部屋</span><b>' + pinned + ' 室</b></div><button type="button" class="btn rp-rebuild" data-rp-act="rebuild"' + (pinned >= rooms.length - 1 ? ' disabled' : '') + '>' + svg('shuffle') + '割当案を再作成</button><p>固定した部屋は、すべての案で同じ割り当てを維持します。</p></aside>' +
      '<section class="rp-proposals" aria-label="割当案"><div class="rp-tabs" role="group" aria-label="比較する割当案">' + Object.entries(options).map(([k, label]) => '<button type="button" data-rp-act="tab" data-rp-val="' + k + '" aria-pressed="' + (k === c.active) + '"><b>案' + k + '</b><span>' + label + '</span></button>').join('') + '</div>' +
      '<div class="rp-summary"><span><b>' + Object.values(plan).flat().length + '</b> / ' + data.people.length + ' 人を割当済み</span><button type="button" data-rp-act="compare">' + svg('table', 15) + '3案を比較</button></div>' +
      '<div class="rp-grid">' + rooms.map(r => roomCard(r, c, data)).join('') + '</div>' +
      '<div class="rp-results"><h2>案' + c.active + ' の内訳</h2>' + metricsHtml(plan, data) + '</div></section></div></div>';
  }

  function comparison(c, d) {
    const rows = [['moves', '現在の部屋から移動', '人'], ['paired', '同室希望が一致', '組'], ['mixed', '全学年を含む部屋', '室'], ['oldPairs', '再び同室になる組', '組']];
    const metrics = Object.fromEntries(Object.entries(c.plans).map(([k, v]) => [k, totals(v, d)]));
    return '<div class="rp-dialog"><p>東棟2階の' + d.people.length + '人について、各案の割り当て結果を比較します。</p><table><thead><tr><th>項目</th>' + Object.keys(options).map(k => '<th>案' + k + '</th>').join('') + '</tr></thead><tbody>' + rows.map(([key, title, unit]) => '<tr><th>' + title + '</th>' + Object.keys(options).map(k => '<td>' + metrics[k][key] + unit + '</td>').join('') + '</tr>').join('') + '</tbody></table><p>同室希望は互いに希望を出した' + d.partner.size / 2 + '組を対象にしています。「再び同室になる組」は、現在と同じ2人が同室になる組数です。</p><div class="rp-dialog-actions">' + Object.keys(options).map(k => '<button class="btn' + (k === c.active ? ' primary' : '') + '" data-rp-act="pick" data-rp-val="' + k + '">案' + k + 'を見る</button>').join('') + '</div></div>';
  }

  function review(c, d, showReserved) {
    const snapshot = showReserved && c.confirmed ? c.confirmed : { plan: c.plans[c.active], option: c.active };
    const isFinal = c.confirmed && samePlan(snapshot.plan, c.confirmed.plan);
    let html = '<div class="rp-dialog"><div class="rp-date"><strong>2027年4月1日（木）</strong> 適用予定</div><h3>案' + snapshot.option + '　' + options[snapshot.option] + '</h3>' + metricsHtml(snapshot.plan, d) + '<dl class="rp-roster">';
    for (const room of rooms) html += '<div><dt>' + room + '号室</dt><dd>' + snapshot.plan[room].map(id => e(d.byId.get(id).name)).join('、') + '</dd></div>';
    html += '</dl><p>確定した割り当ては次年度の部屋割りとして保存されます。現在の在寮名簿には引き続き今の居室が表示されます。</p><div class="rp-dialog-actions"><button class="btn" data-rp-act="cancel">閉じる</button>' + (isFinal ? '' : '<button class="btn primary" data-rp-act="confirm">' + (c.confirmed ? '確定案を更新' : 'この割当で確定') + '</button>') + '</div></div>';
    D.openDialog(isFinal ? '確定した部屋割り' : '部屋割りを確認', html);
  }

  function studentDialog(id, c, d) {
    const p = d.byId.get(id);
    if (!p) return;
    const plan = c.plans[c.active], room = rooms.find(r => plan[r].includes(id));
    const other = d.byId.get(d.partner.get(id));
    const eligible = rooms.filter(r => r !== room && !c.locks[r]);
    const moveOptions = otherRoom => '<optgroup label="' + otherRoom + '号室">' + plan[otherRoom].map(otherId => '<option value="' + e(otherId) + '">' + otherRoom + '号室　' + e(d.byId.get(otherId).name) + '</option>').join('') + '</optgroup>';
    D.openDialog('寮生の割当を確認', '<div class="rp-dialog"><h3>' + e(p.name) + ' <small>' + e(p.grade) + '年</small></h3><dl class="rp-roster"><div><dt>現在の部屋</dt><dd>' + e(p.room) + '号室</dd></div><div><dt>案' + c.active + 'の部屋</dt><dd>' + room + '号室</dd></div><div><dt>同室希望</dt><dd>' + (other ? e(other.name) : '申告なし') + '</dd></div></dl>' +
      (c.locks[room] ? '<p>この部屋の固定を解除すると、他室の寮生と入れ替えられます。</p>' : !eligible.length ? '<p>入れ替え先の部屋を1室以上、固定解除してください。</p>' : '<label class="rp-field">入れ替える相手<select id="rp-swap-target">' + eligible.map(moveOptions).join('') + '</select></label>') +
      '<div class="rp-dialog-actions"><button class="btn" data-rp-act="cancel">閉じる</button>' + (!c.locks[room] && eligible.length ? '<button class="btn primary" data-rp-act="swap" data-rp-val="' + e(id) + '">' + svg('move') + '割当を入れ替える</button>' : '') + '</div></div>');
  }

  function update(message) {
    D.save();
    D.render();
    if (message) D.notify(message);
  }

  document.addEventListener('click', event => {
    const btn = event.target.closest('[data-rp-act]');
    if (!btn) return;
    const d = roster(), c = configFor(d), act = btn.dataset.rpAct, val = btn.dataset.rpVal;
    const plan = c.plans[c.active];
    if (act === 'tab' || act === 'pick') {
      if (!options[val]) return;
      c.active = val;
      if (act === 'pick') D.closeDialog();
      update();
    } else if (act === 'pin' && rooms.includes(val)) {
      if (c.locks[val]) delete c.locks[val];
      else c.locks[val] = plan[val].slice();
      // Keep the open proposal intact; regenerate the other proposals with the same fixed residents.
      Object.keys(options).filter(k => k !== c.active).forEach(k => { c.plans[k] = createCandidate(k, c, d); });
      update(val + '号室の固定' + (c.locks[val] ? 'を設定しました' : 'を解除しました'));
    } else if (act === 'rebuild') {
      c.seed++;
      buildAll(c, d);
      update('現在の条件で3つの案を再作成しました');
    } else if (act === 'review' || act === 'reserved') {
      review(c, d, act === 'reserved');
    } else if (act === 'compare') {
      D.openDialog('3つの割当案を比較', comparison(c, d));
    } else if (act === 'person') {
      studentDialog(val, c, d);
    } else if (act === 'swap') {
      const target = document.getElementById('rp-swap-target')?.value;
      const a = rooms.find(r => plan[r].includes(val)), b = rooms.find(r => plan[r].includes(target));
      if (!a || !b || a === b || c.locks[a] || c.locks[b]) return;
      const u = plan[a].indexOf(val), v = plan[b].indexOf(target);
      [plan[a][u], plan[b][v]] = [plan[b][v], plan[a][u]];
      D.closeDialog();
      update('2人の割当を入れ替えました');
    } else if (act === 'confirm') {
      c.confirmed = { option: c.active, plan: clonePlan(plan), effective };
      D.closeDialog();
      update('4月1日からの部屋割りを確定しました');
    } else if (act === 'cancel') {
      D.closeDialog();
    }
  });

  document.addEventListener('change', event => {
    const flag = event.target.dataset.rpFlag;
    if (!['mix', 'avoid'].includes(flag)) return;
    const d = roster(), c = configFor(d);
    c[flag] = event.target.checked;
    c.seed++;
    buildAll(c, d);
    update('条件を割当案に反映しました');
    document.querySelector('[data-rp-flag="' + flag + '"]')?.focus({ preventScroll: true });
  });

  D.register('rooms', workspace);
})();

</script>
<script>
(() => {

  const shortDate = date => /^\d{4}-\d{2}-\d{2}$/.test(date || '') ? Number(date.slice(5,7)) + '/' + Number(date.slice(8)) : (date || '—');

  const appendId = prefix => prefix + '-' + (globalThis.crypto?.randomUUID?.() || Date.now() + '-' + Math.random().toString(36).slice(2));
  const statusPill = (label, kind = '') => `<span class="st-pill st-pill-${esc(kind)}">${esc(label)}</span>`;
  const myMeal = date => D.isDinnerBooked(date, me);
  const activePickup = date => D.dinnerPickup(date,me);
  const mealQueue = date => myRequests().find(r => r.type === 'meal' && r.status === 'pending' && (r.mealDate || today) === date);
  const textBtn = (action, content, cls = 'btn', attrs = '') => `<button type="button" class="${cls}" data-student-action="${action}" ${attrs}>${content}</button>`;
  const jump = (route, content, cls = 'st-link') => textBtn('go',content,cls,`data-student-route="${route}"`);
